<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MKHKASG: MoonRunner — Endless 1-bit</title>
<style>
  :root { --w: 960; --h: 540; }
  html,body{margin:0;height:100%;background:#000;color:#fff;font-family:ui-monospace,Consolas,Menlo,monospace}
  body.invert{background:#fff;color:#000}
  .wrap{display:grid;place-items:center;height:100%;gap:8px;padding:10px}
  canvas{
    max-width:100vw; max-height:100vh;
    width:min(96vw,96vh*(16/9));
    height:calc(var(--h) * (min(96vw,96vh*(16/9)) / var(--w)));
    image-rendering:pixelated; image-rendering:crisp-edges; background:transparent; outline:1px solid #ffffff22;
  }
  .hud{width:min(96vw,96vh*(16/9));display:flex;justify-content:space-between;align-items:center;font-size:12px;opacity:.95}
  .hud .left,.hud .right{display:flex;gap:10px;align-items:center}
  .btn{padding:3px 8px;border:1px solid currentColor;cursor:pointer;user-select:none}
  .btn:active{transform:translateY(1px)}
  /* Mobile onscreen controls */
  .mobile{position:fixed;inset:auto 0 10px 0;display:none;justify-content:space-between;pointer-events:none;width:100%;padding:0 8px}
  .pad{pointer-events:auto;background:#000;color:#fff;opacity:.8;border:1px solid #fff;border-radius:10px;width:31vw;height:16vh;display:flex;align-items:center;justify-content:center;font-size:18px;touch-action:none}
  .jump{width:31vw;height:16vh}
  @media (max-width: 820px){ .mobile{display:flex} .hud .right{display:none} }
</style>
</head>
<body>
<div class="wrap">
  <canvas id="game" width="960" height="540"></canvas>
  <div class="hud">
    <div class="left"><span id="status">Ready</span> <span>•</span> <span>←/→ move • W/↑/Space jump • Esc pause</span></div>
    <div class="right">
      <div id="mute" class="btn">🔈 Sound</div>
      <div id="invert" class="btn">⬛/⬜ Contrast</div>
      <div id="fs" class="btn">⛶ Full</div>
      <div id="speeddown" class="btn">–Speed</div>
      <div id="speedup" class="btn">+Speed</div>
    </div>
  </div>
</div>

<!-- Mobile buttons -->
<div class="mobile">
  <div style="display:flex;gap:8px;padding-left:8px;">
    <div id="btnLeft" class="pad">◀</div>
    <div id="btnRight" class="pad">▶</div>
  </div>
  <div style="padding-right:8px;">
    <div id="btnJump" class="pad jump">⤒</div>
  </div>
</div>

<script>
/* ===========================================================
   MKHKASG: MoonRunner — manual-move endless (1-bit, single file)
   =========================================================== */

const CV = document.getElementById('game');
const ctx = CV.getContext('2d', { alpha:false });
ctx.imageSmoothingEnabled = false;

const W = 960, H = 540;
let DPR = Math.max(1, Math.min(3, window.devicePixelRatio || 1));

function resizeCanvas(){
  DPR = Math.max(1, Math.min(3, window.devicePixelRatio || 1));
  CV.width  = Math.floor(W * DPR);
  CV.height = Math.floor(H * DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.imageSmoothingEnabled = false;
}
addEventListener('resize', resizeCanvas); resizeCanvas();

// Colors respect invert
function inverted(){ return document.body.classList.contains('invert'); }
function FG(){ return inverted() ? '#000' : '#fff'; }
function BG(){ return inverted() ? '#fff' : '#000'; }
const fill = (x,y,w,h,col)=>{ ctx.fillStyle=col; ctx.fillRect(x|0,y|0,w|0,h|0); };

// ---- Sound (bleeps) ----
let audio=null, muted=false;
function beep(kind='jump'){
  if(muted) return;
  if(!audio) audio = new (window.AudioContext||window.webkitAudioContext)();
  const o = audio.createOscillator(), g = audio.createGain();
  o.type='square';
  const now = audio.currentTime;
  const table = { jump:[440,220,.13, .06], coin:[660,440,.12,.06], hit:[110,55,.16,.07], win:[523,659,.18,.08] };
  const [f1,f2,dur,vol] = table[kind]||table.jump;
  o.frequency.setValueAtTime(f1,now); o.frequency.exponentialRampToValueAtTime(f2,now+dur);
  g.gain.setValueAtTime(vol,now); g.gain.exponentialRampToValueAtTime(0.0001,now+dur);
  o.connect(g); g.connect(audio.destination); o.start(); o.stop(now+dur);
}

// ---- RNG ----
let seed=2025; const rnd=()=> (seed=(seed*1664525+1013904223)>>>0, (seed%1000)/1000);

// ---- State ----
let state='menu'; // menu | play | paused | over
let score=0, best = Number(localStorage.getItem('moon_best')||0);
let baseSpeed=2.8, time=0;

const statusEl = document.getElementById('status');
document.getElementById('mute').onclick = ()=>{ muted=!muted; event.currentTarget.textContent = muted?'🔇 Muted':'🔈 Sound'; };
document.getElementById('invert').onclick = ()=> document.body.classList.toggle('invert');
document.getElementById('fs').onclick = ()=> CV.requestFullscreen?.();
document.getElementById('speedup').onclick = ()=>{ baseSpeed=Math.min(7, baseSpeed*1.05); hint(`Speed ${baseSpeed.toFixed(2)}`); };
document.getElementById('speeddown').onclick = ()=>{ baseSpeed=Math.max(2, baseSpeed*0.95); hint(`Speed ${baseSpeed.toFixed(2)}`); };

// ---- Player & physics ----
const GRAV=0.65, JUMP=11.5, FRICTION=0.86, COYOTE=120, BUFFER=120;
const player = { x:120,y:H-120,w:16,h:22,vx:0,vy:0,on:false,shield:0,slow:0 };
let coyoteUntil=0, bufferUntil=0;

// ---- World ----
const floorY = H-84;
let segments=[], entities=[], items=[];
let scroll=0, speed=baseSpeed;

function resetWorld(){
  segments=[]; entities=[]; items=[]; scroll=0; score=0; time=0; speed=baseSpeed;
  segments.push({x:0,w:360,type:'ground'}); // runway
  spawnUntil(W*2.2);
  Object.assign(player,{x:120,y:floorY-player.h,vx:0,vy:0,on:false,shield:0,slow:0});
}
function endX(){ return segments.length?segments[segments.length-1].x+segments[segments.length-1].w:0; }

function spawnUntil(target){
  while(endX()<target){
    const t = Math.min(1, score/1000);
    const minGround = (score<200? 240: 160 - t*40);
    const maxGap = (score<200? 60: 90 + t*80);

    const gW = minGround + Math.floor(rnd()*140);
    const gap = 50 + Math.floor(rnd()*maxGap);

    // Ground
    const gx = endX();
    segments.push({x:gx,w:gW,type:'ground'});

    // Ceiling spike (later only)
    if(score>350 && rnd()<0.25){
      const cx = gx + 40 + Math.floor(rnd()*(gW-80));
      entities.push({kind:'spike',x:cx,y:floorY-60,w:40,h:10});
    }
    // Alien (not near edges)
    if(rnd()<0.35 && gW>100){
      const ax = gx + 40 + Math.floor(rnd()*(gW-100));
      entities.push({kind:'alien',x:ax,y:floorY-14,w:22,h:14,dir:(rnd()<0.5?-1:1),baseX:ax,range:36+Math.floor(rnd()*44)});
    }
    // Chip
    if(rnd()<0.6){
      const ix = gx + 30 + Math.floor(rnd()*(gW-60));
      items.push({kind:'chip',x:ix,y:floorY-40,w:10,h:10});
    }
    // Rare powerups
    if(rnd()<0.08){
      const px = gx + gW-60; const k = rnd()<0.5?'shield':'slow';
      items.push({kind:k,x:px,y:floorY-48,w:12,h:12});
    }

    // Gap
    segments.push({x:endX(),w:gap,type:'gap'});
  }
}

function rect(a,b){ return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y; }

// ---- Input ----
const keys={};
addEventListener('keydown',e=>{
  if(['ArrowLeft','ArrowRight','ArrowUp',' ','w','W','a','A','d','D','Escape','Enter'].includes(e.key)) e.preventDefault();
  keys[e.key]=true;
  if(e.key==='Escape'){ if(state==='play'){state='paused';hint('Paused')} else if(state==='paused'){state='play';hint('Resume')} }
  if(state==='menu' && (e.key===' '||e.key==='Enter'||e.key==='ArrowUp'||e.key==='w'||e.key==='W')) start();
  if(state==='over' && (e.key===' '||e.key==='Enter'||e.key==='r'||e.key==='R')) start();
});
addEventListener('keyup',e=> keys[e.key]=false);
// Touch
function bindTouch(id, on, off){
  const el=document.getElementById(id);
  const down=ev=>{ev.preventDefault();on();};
  const up=ev=>{ev.preventDefault();off();};
  el.addEventListener('touchstart',down,{passive:false});
  el.addEventListener('touchend',up,{passive:false});
  el.addEventListener('touchcancel',up,{passive:false});
}
bindTouch('btnLeft', ()=>keys['ArrowLeft']=true, ()=>keys['ArrowLeft']=false);
bindTouch('btnRight',()=>keys['ArrowRight']=true,()=>keys['ArrowRight']=false);
bindTouch('btnJump', ()=>{ keys[' ']=true; bufferUntil=performance.now()+BUFFER; }, ()=>keys[' ']=false);

function hint(t){ document.getElementById('status').textContent=t; }
function start(){ resetWorld(); state='play'; hint('Running…'); beep('coin'); }
function gameOver(){ state='over'; best=Math.max(best,Math.floor(score)); localStorage.setItem('moon_best',String(best)); hint('Game Over — Space to retry'); beep('hit'); }

// ---- Update ----
function update(dt){
  if(state!=='play') return;

  // Manual left/right
  const left  = keys['ArrowLeft']||keys['a']||keys['A'];
  const right = keys['ArrowRight']||keys['d']||keys['D'];
  const jump  = keys['ArrowUp']||keys['w']||keys['W']||keys[' '];

  // Base speed (influences scroll of world, not player)
  time += dt; speed += (baseSpeed - speed)*0.02;
  const slow = player.slow>0 ? 0.6 : 1;

  // Scroll world slightly with player, but keep manual control vibe:
  scroll += speed*0.6*slow;

  spawnUntil(scroll + W*2.2);

  // Player horizontal
  if(left)  player.vx -= 0.7;
  if(right) player.vx += 0.7;
  player.vx *= FRICTION;

  // Gravity
  player.vy += GRAV;

  // Coyote/buffer
  const now=performance.now();
  if(player.on) coyoteUntil=now+COYOTE;
  if(jump) bufferUntil=now+BUFFER;
  if(bufferUntil>now && coyoteUntil>now){
    player.vy = -JUMP; player.on=false; bufferUntil=0; coyoteUntil=0; beep('jump');
  }

  // Apply
  player.x += player.vx;
  player.y += player.vy;

  // Ground collisions
  player.on=false;
  const worldX = player.x + scroll;
  for(const s of segments){
    if(s.type!=='ground') continue;
    if(worldX+player.w < s.x-8 || worldX > s.x+s.w+8) continue;
    const a={x:worldX,y:player.y,w:player.w,h:player.h}, b={x:s.x,y:floorY,w:s.w,h:48};
    if(rect(a,b)){
      if(player.vy>0 && player.y+player.h-player.vy<=floorY){
        player.y=floorY-player.h; player.vy=0; player.on=true;
      } else if(player.vy<0 && player.y-player.vy>=floorY+48){
        player.y=floorY+48; player.vy=0;
      } else {
        if(player.vx>0) player.x=(s.x-scroll)-player.w;
        else if(player.vx<0) player.x=(s.x+s.w-scroll);
        player.vx=0;
      }
    }
  }

  // Crater death
  if(player.y>H+40){
    if(player.shield>0){ player.shield=0; player.y=floorY-player.h-2; player.vy=-JUMP*0.8; beep('hit'); }
    else gameOver();
  }

  // Entities
  for(const e of entities){
    if(e.kind==='alien'){
      e.x += e.dir*0.7;
      if(Math.abs(e.x - e.baseX) > e.range) e.dir*=-1;
      if(rect({x:worldX,y:player.y,w:player.w,h:player.h},{x:e.x,y:e.y,w:e.w,h:e.h})){
        if(player.shield>0){ player.shield=0; beep('hit'); e.x += (e.dir*-1)*40; }
        else gameOver();
      }
    } else if(e.kind==='spike'){
      if(rect({x:worldX,y:player.y,w:player.w,h:player.h},{x:e.x,y:e.y,w:e.w,h:e.h})){
        if(player.shield>0){ player.shield=0; beep('hit'); } else gameOver();
      }
    }
  }

  // Items
  for(let i=items.length-1;i>=0;i--){
    const it=items[i];
    if(rect({x:worldX,y:player.y,w:player.w,h:player.h},{x:it.x,y:it.y,w:it.w,h:it.h})){
      if(it.kind==='chip'){ score+=100; beep('coin'); }
      if(it.kind==='shield'){ player.shield=1; beep('coin'); }
      if(it.kind==='slow'){ player.slow=180; beep('coin'); }
      items.splice(i,1);
    }
  }

  if(player.slow>0) player.slow--;

  // Score by time + slight bonus for moving right
  score += (dt*0.06) + Math.max(0, player.vx)*0.03;
}

// ---- Drawing helpers (1-bit sprites via vector pixels) ----
function spriteAstronaut(x,y,pose='idle'){
  // 16x22 body with visor hole; simple run frames by shifting legs
  const f=FG(), b=BG();
  fill(x,y,16,22,f);
  fill(x+4,y+6,6,6,b); // visor
  if(pose==='run1'){ fill(x+2,y+18,5,2,b); fill(x+10,y+18,4,2,b); }
  if(pose==='run2'){ fill(x+1,y+18,4,2,b); fill(x+9,y+18,6,2,b); }
  if(pose==='jump'){ fill(x+3,y+18,10,2,b); }
}
function spriteAlien(x,y,frame=0){
  const f=FG(), b=BG();
  fill(x,y,22,14,f);
  fill(x+4,y+4,4,4,b);
  if(frame%2===0) fill(x+14,y+4,2,2,b); // tiny blink
}
function spriteUFO(x,y,frame=0){
  const f=FG(), b=BG();
  // saucer
  fill(x-28,y,56,8,f);
  fill(x-22,y-8,44,6,f);
  fill(x-4,y-14,8,6,f);
  // beam flicker bars
  if(frame%3!==0){
    for(let i=0;i<50;i+=4) fill(x-6+(i%12)-6,y+12+i,12,2,f);
  }
}
function tileGround(x,y,w){
  const f=FG(), b=BG();
  fill(x,y,w,44,f);
  for(let i=0;i<w;i+=8) for(let j=0;j<44;j+=8) if(((i+j)>>3)&1) fill(x+i,y+j,4,4,b);
}

// ---- Draw ----
function draw(){
  ctx.fillStyle=BG(); ctx.fillRect(0,0,W,H);

  // Stars (two parallax layers)
  ctx.fillStyle=FG();
  for(let i=0;i<120;i++){
    const x1 = ((i*83)%2000) - (scroll*0.25 % 2000); const y1=(i*131)%H;
    const xx1 = ((x1+2000)%2000) - 100; if(xx1>=0 && xx1<W) ctx.fillRect(xx1|0,y1|0,1,1);
    const x2 = ((i*211)%2400) - (scroll*0.10 % 2400); const y2=(i*97)%H;
    const xx2 = ((x2+2400)%2400) - 100; if(xx2>=0 && xx2<W) ctx.fillRect(xx2|0,y2|0,1,1);
  }

  // Horizon guide
  fill(0,floorY-40,W,2,FG());

  // Ground
  for(const s of segments){
    if(s.type!=='ground') continue;
    const x=(s.x - scroll)|0; const w=s.w|0;
    if(x>W || x+w<-50) continue;
    tileGround(x,floorY,w);
  }

  // Entities
  let frame = (performance.now()/120|0);
  for(const e of entities){
    const x=(e.x - scroll)|0, y=e.y|0;
    if(e.kind==='alien') spriteAlien(x,y,frame);
    else if(e.kind==='spike') fill(x,y,e.w,e.h,FG());
  }

  // Items
  for(const it of items){
    const x=(it.x - scroll)|0, y=it.y|0, f=FG(), b=BG();
    if(it.kind==='chip'){ fill(x,y,10,10,f); fill(x+3,y+3,4,4,b); }
    if(it.kind==='shield'){ fill(x,y,12,12,f); fill(x+2,y+2,8,8,b); }
    if(it.kind==='slow'){ fill(x,y,12,12,f); fill(x+2,y+5,8,2,b); }
  }

  // Player
  const pose = player.on ? (frame%2?'run1':'run2') : (player.vy<0?'jump':'idle');
  spriteAstronaut(player.x|0, player.y|0, pose);
  if(player.shield>0){
    fill(player.x-2,player.y-2, player.w+4,2,FG());
    fill(player.x-2,player.y+player.h, player.w+4,2,FG());
    fill(player.x-2,player.y-2,2,player.h+4,FG());
    fill(player.x+player.w,player.y-2,2,player.h+4,FG());
  }

  // UI
  ctx.fillStyle=FG(); ctx.font="12px monospace";
  const s = `SCORE ${Math.floor(score).toString().padStart(5,'0')}   BEST ${best.toString().padStart(5,'0')}`;
  ctx.fillText(s,10,18);

  if(state==='menu'){
    // Poster-like title (no border)
    const title="MKHKASG: MOONRUNNER";
    const tW = ctx.measureText(title).width;
    ctx.fillText(title,(W-tW)/2|0,H*0.30);
    spriteUFO(W/2|0, H*0.30-40|0, frame);
    // astronaut under beam
    spriteAstronaut(W/2-8|0, H*0.30+18|0, 'idle');

    const sub="Press SPACE to start • ←/→ move • W/↑/Space jump • Esc pause";
    const sub2="Goal: survive. Chips +100. Shield=1 hit. Slow-mo=3s.";
    const w1=ctx.measureText(sub).width, w2=ctx.measureText(sub2).width;
    ctx.fillText(sub, (W-w1)/2|0, H*0.30+50);
    ctx.fillText(sub2,(W-w2)/2|0, H*0.30+70);
  }

  if(state==='paused'){
    const msg="PAUSED — Esc to resume"; const w=ctx.measureText(msg).width;
    ctx.fillText(msg,(W-w)/2|0,H*0.5);
  }
  if(state==='over'){
    const msg="GAME OVER"; const tip="Space/Enter to retry";
    const w=ctx.measureText(msg).width, w2=ctx.measureText(tip).width;
    ctx.fillText(msg,(W-w)/2|0,H*0.45);
    ctx.fillText(tip,(W-w2)/2|0,H*0.45+22);
  }
}

// ---- Loop ----
let last=performance.now();
function tick(now){
  const dt=Math.min(33, now-last); last=now;
  if(state==='play') update(dt);
  draw(); requestAnimationFrame(tick);
}
resetWorld(); state='menu'; hint('Press Space to start');
requestAnimationFrame(tick);
</script>
</body>
</html>
