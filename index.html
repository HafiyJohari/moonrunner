<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>MKHKASG: MoonRunner</title>

<!-- Title font (requested): Press Start 2P -->
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
/* =========================
   ========== STYLE =========
   1-bit: pure #000 / #fff
   ========================= */
:root {
  color-scheme: light dark;
  --bg: #000;   /* default black background */
  --fg: #fff;   /* default white foreground */
  --uiAlpha: 0.9;
  --padZ: 9999;
}

html, body {
  margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--fg);
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  -webkit-font-smoothing: none; -moz-osx-font-smoothing: grayscale;
  image-rendering: pixelated; image-rendering: crisp-edges;
}

.wrapper {
  display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
  min-height: 100dvh; gap: .75rem; padding: .75rem .5rem 5rem;
}

.toolbar {
  display: flex; gap: .5rem; align-items: center; justify-content: center;
  border: 1px solid var(--fg); padding: .35rem .5rem; font-size: 12px;
  position: sticky; top: .5rem; z-index: 5; background: color-mix(in oklab, var(--bg) 85%, var(--fg) 15%);
  opacity: var(--uiAlpha);
}
.toolbar button, .toolbar .group { border: 1px solid var(--fg); background: transparent; color: var(--fg); }
.toolbar button { padding: .3rem .6rem; cursor: pointer; }
.toolbar input[type="range"] { width: 100px; accent-color: var(--fg); }
.toolbar .group { display: inline-flex; align-items: center; gap: .4rem; padding: .3rem .5rem; }
.toolbar .value { min-width: 36px; text-align: right; font-variant-numeric: tabular-nums; }

/* Canvas scales to min(96vw, 96vh*(16/9)) with 16:9 enforced via wrapper rules */
.stage {
  position: relative;
}
#game {
  display: block;
  width: min(96vw, calc(96vh * (16 / 9)));
  height: calc(min(96vw, calc(96vh * (16 / 9))) * (9 / 16));
  outline: 1px solid var(--fg);
}

/* HUD overlays */
.hud {
  position: absolute; left: 8px; top: 8px; font-size: 12px; letter-spacing: .5px;
  mix-blend-mode: normal; user-select: none; pointer-events: none;
}
.overlayCenter {
  position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none;
  text-align: center; padding: 1rem;
}
.smallNote { font-size: 12px; margin-top: .5rem; opacity: .9; }

/* Title styling */
.titleBlock { font-family: "Press Start 2P", system-ui, sans-serif; line-height: 1.4; }
.titleMain { font-size: clamp(16px, 3vw, 32px); }
.subtitle { font-size: clamp(10px, 1.6vw, 14px); margin-top: .75rem; }

/* Mobile pads */
.pads {
  position: fixed; inset: auto 0 0 0; display: grid; grid-template-columns: 1fr 1fr;
  gap: .5rem; padding: .75rem; z-index: var(--padZ);
}
.padLeft, .padRight {
  display: grid; grid-template-columns: 1fr 1fr; gap: .5rem;
}
.padJump {
  display: grid; grid-template-columns: 1fr; gap: .5rem;
}
.padBtn {
  background: color-mix(in oklab, var(--bg) 75%, var(--fg) 25%);
  border: 2px solid var(--fg); color: var(--fg);
  font-size: clamp(14px, 4vw, 18px); padding: 1.1rem 0;
  touch-action: none; user-select: none; -webkit-user-select: none;
}
.pads .ghost { opacity: .7; }

/* Desktop hides mobile, mobile hides toolbar */
@media (pointer: coarse), (max-width: 920px) {
  .toolbar { display: none; }
  .pads { display: grid; }
}
@media (pointer: fine) and (min-width: 921px) {
  .pads { display: none; }
}

/* Contrast invert (toolbar toggle) */
.invert {
  --bg: #fff;
  --fg: #000;
  filter: invert(1);
}
</style>
</head>
<body>
<div class="wrapper" id="root">
  <!-- ===== Desktop toolbar (hidden on mobile) ===== -->
  <div class="toolbar" id="toolbar" aria-label="Desktop Toolbar">
    <button id="btnSound" title="Toggle Sound (M)">🔊 Sound</button>
    <button id="btnContrast" title="Invert (Contrast)">◐ Contrast</button>
    <button id="btnFullscreen" title="Fullscreen (F)">⤢ Fullscreen</button>
    <div class="group" title="Base Speed ±5%">
      <span>Speed</span>
      <button id="speedMinus" aria-label="Speed -">−</button>
      <span class="value" id="speedVal">100%</span>
      <button id="speedPlus" aria-label="Speed +">+</button>
    </div>
  </div>

  <!-- ===== Canvas stage ===== -->
  <div class="stage" style="position:relative;">
    <canvas id="game" width="960" height="540"></canvas>

    <!-- HUD -->
    <div class="hud" id="hud">SCORE 00000  BEST 00000</div>

    <!-- Center overlays (title / pause / game over) -->
    <div class="overlayCenter" id="centerOverlay" aria-live="polite">
      <div class="titleBlock" id="titleBlock">
        <div class="titleMain">MKHKASG: MOONRUNNER</div>
        <div class="smallNote subtitle" style="margin-top:12px">Press SPACE to start • ←/→ move • W/↑/Space jump • Esc pause</div>
        <div class="smallNote">Goal: survive. Chips +100. Shield = 1 hit. Slow-mo = 3s.</div>
      </div>
    </div>
  </div>

  <!-- ===== Mobile pads (hidden on desktop) ===== -->
  <div class="pads" id="pads">
    <div class="padLeft">
      <button class="padBtn ghost" id="btnLeft">◀</button>
      <button class="padBtn ghost" id="btnRight">▶</button>
    </div>
    <div class="padJump">
      <button class="padBtn" id="btnJump">⤒ JUMP</button>
    </div>
  </div>
</div>

<script>
/* ===========================================================
   ======================== SOUNDS ===========================
   Tiny WebAudio bleeps, reused context
   =========================================================== */
const AudioSys = (() => {
  let ctx = null, enabled = true, master = null;

  function ensure() {
    if (!ctx) {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain();
      master.gain.value = 0.05; // quiet gain
      master.connect(ctx.destination);
    }
    if (ctx.state === "suspended") ctx.resume();
  }
  function setEnabled(v){ enabled = !!v; }
  function tone(type, freq=440, dur=0.08, vol=0.25) {
    if (!enabled) return;
    ensure();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.value = vol;
    o.connect(g); g.connect(master);
    const t = ctx.currentTime;
    o.start(t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.stop(t + dur + 0.02);
  }
  return {
    tone,
    on(){ setEnabled(true); },
    off(){ setEnabled(false); },
    toggle(){ enabled = !enabled; return enabled; },
    enabled(){ return enabled; }
  };
})();

/* ===========================================================
   ======================== SPRITES ==========================
   Code-drawn masks (rect fills) in pure 1-bit
   =========================================================== */
const W = 960, H = 540;

/* Astronaut 16x22: round helmet + square visor; frames: idle, run1, run2, jump */
function drawAstronaut(ctx, x, y, frame) {
  ctx.save();
  ctx.translate(x,y);
  // body rectangle (torso/legs)
  ctx.fillStyle = "#fff";
  ctx.fillRect(2, 8, 12, 12); // torso/legs
  // head (round-ish): circle mask via squares (pixelated vibe)
  ctx.fillRect(3, 2, 10, 1);
  ctx.fillRect(2, 3, 12, 1);
  ctx.fillRect(1, 4, 14, 1);
  ctx.fillRect(1, 5, 14, 1);
  ctx.fillRect(1, 6, 14, 1);
  ctx.fillRect(2, 7, 12, 1);
  ctx.fillRect(3, 8, 10, 1);
  // visor (square)
  ctx.fillStyle = "#000";
  ctx.fillRect(5, 4, 6, 5);

  // simple limb animation by frame
  ctx.fillStyle = "#fff";
  if (frame === "run1") {
    // right leg forward, left back
    ctx.fillRect(3, 20, 4, 2);
    ctx.fillRect(9, 19, 4, 3);
    // arms
    ctx.fillRect(0, 11, 3, 2);
    ctx.fillRect(13, 11, 3, 2);
  } else if (frame === "run2") {
    ctx.fillRect(3, 19, 4, 3);
    ctx.fillRect(9, 20, 4, 2);
    ctx.fillRect(0, 12, 3, 2);
    ctx.fillRect(13, 10, 3, 2);
  } else if (frame === "jump") {
    ctx.fillRect(3, 19, 4, 2);
    ctx.fillRect(9, 19, 4, 2);
    ctx.fillRect(0, 10, 3, 2);
    ctx.fillRect(13, 10, 3, 2);
  } else {
    // idle
    ctx.fillRect(6, 20, 4, 2);
    ctx.fillRect(0, 11, 3, 2);
    ctx.fillRect(13, 11, 3, 2);
  }
  ctx.restore();
}

/* Alien 22x14: idle1/idle2 wobble */
function drawAlien(ctx, x, y, idle2=false) {
  ctx.save();
  ctx.translate(x,y);
  ctx.fillStyle = "#fff";
  // body oval-ish
  const rows = [4,6,8,10,8,6,4];
  let ox = idle2 ? 1 : 0;
  let yy = 2;
  rows.forEach(w => {
    ctx.fillRect( (11 - Math.floor(w/2)) + ox, yy, w, 1);
    yy++;
  });
  // eyes (holes)
  ctx.fillStyle = "#000";
  ctx.fillRect(8+ox,5,2,1);
  ctx.fillRect(12+ox,5,2,1);
  // tiny legs
  ctx.fillStyle = "#fff";
  ctx.fillRect(7+ox, 12, 2, 2);
  ctx.fillRect(13+ox, 12, 2, 2);
  ctx.restore();
}

/* UFO 56x20 with beam flicker */
function drawUFO(ctx, x, y, beam=true) {
  ctx.save();
  ctx.translate(x,y);
  ctx.fillStyle = "#fff";
  // saucer top
  ctx.fillRect(12,0,32,2);
  ctx.fillRect(8,2,40,2);
  ctx.fillRect(6,4,44,2);
  ctx.fillRect(4,6,48,2);
  // dome
  ctx.fillRect(24, -2, 8, 2);
  // bottom plate
  ctx.fillRect(0,8,56,2);
  ctx.fillRect(6,10,44,2);
  ctx.fillRect(10,12,36,2);
  // beam (flicker using gaps)
  if (beam) {
    ctx.fillRect(26,14,4,2);
    ctx.fillRect(22,16,12,2);
    ctx.fillRect(20,18,16,2);
  }
  ctx.restore();
}

/* Pickups: chip 10x10, shield 12x12 outline, slow-mo 12x12 bar */
function drawChip(ctx, x, y) {
  ctx.fillStyle = "#fff";
  ctx.fillRect(x+2,y,6,2);
  ctx.fillRect(x,y+2,10,6);
  ctx.fillRect(x+2,y+8,6,2);
  // inner hole
  ctx.fillStyle = "#000";
  ctx.fillRect(x+3,y+3,4,4);
}
function drawShield(ctx, x, y) {
  ctx.fillStyle = "#fff";
  ctx.fillRect(x+1,y,10,1);
  ctx.fillRect(x,y+1,1,10);
  ctx.fillRect(x+11,y+1,1,10);
  ctx.fillRect(x+1,y+11,10,1);
}
function drawSlow(ctx, x, y) {
  ctx.fillStyle = "#fff";
  ctx.fillRect(x, y+5, 12, 2); // horizontal bar
}

/* Ground tile dither (top lip + rocky dither) */
function drawGroundSegment(ctx, x, topY, w) {
  // top lip
  ctx.fillStyle = "#fff";
  ctx.fillRect(x, topY, w, 2);
  // dither fill below
  for (let yy = topY+2; yy < H; yy++) {
    for (let xx = x; xx < x+w; xx++) {
      // Bayer-like checker
      if (((xx>>1) + (yy>>1)) % 2 === 0) {
        ctx.fillRect(xx, yy, 1, 1);
      }
    }
  }
}

/* ===========================================================
   ======================== WORLD GEN ========================
   Endless procedural ground + gaps, aliens & pickups
   =========================================================== */
const RNG = (() => {
  let s = 1337;
  function rand(){ s ^= s<<13; s ^= s>>>17; s ^= s<<5; return (s>>>0)/4294967295; }
  function seed(v){ s = v>>>0; }
  return { rand, seed };
})();

const world = {
  scroll: 2.0,        // base scroll px/frame (scaled by dt and speedFactor)
  speedFactor: 1.0,   // user toolbar ±5% steps
  time: 0,
  elapsed: 0,
  segments: [],       // {x, w, yTop}
  entities: [],       // aliens
  items: [],          // pickups
  starsA: [],         // parallax layer A
  starsB: [],         // parallax layer B
  tutorialSecs: 10,
  lastSegX: 0,
  floorY: Math.floor(H*0.78),
  slowMoUntil: 0
};

function initStars() {
  world.starsA = []; world.starsB = [];
  const total = Math.floor(60 + RNG.rand()*60); // 60–120
  for (let i=0;i<total;i++) {
    const layer = (i % 2 === 0) ? 'A' : 'B';
    const star = { x: RNG.rand()*W, y: RNG.rand()*Math.floor(H*0.7) };
    (layer==='A'?world.starsA:world.starsB).push(star);
  }
}

function resetWorld(seed=Date.now()) {
  RNG.seed(seed);
  world.scroll = 2.0;
  world.speedFactor = 1.0;
  world.time = 0;
  world.elapsed = 0;
  world.segments = [];
  world.entities = [];
  world.items = [];
  world.lastSegX = 0;
  initStars();
  // Build initial runway: safe small gaps only, no aliens
  let x = 0;
  while (x < W*2) {
    const segW = Math.floor(80 + RNG.rand()*140); // 80–220
    world.segments.push({ x, w: segW, yTop: world.floorY });
    x += segW;
    const gap = Math.floor(20 + RNG.rand()*35); // small gaps
    x += gap;
  }
  world.lastSegX = x;
}

/* Difficulty ramp after tutorial */
function getDifficulty() {
  const t = Math.max(0, world.elapsed - world.tutorialSecs);
  // gently ramp speed and gaps
  const spd = 2.0 + Math.min(3.0, t*0.02); // +0.02 per sec up to +3
  const gapMax = 35 + Math.min(85, t*1.8); // increases max gap
  return { spd, gapMax };
}

function spawnAhead(toX) {
  while (world.lastSegX < toX) {
    const afterTutorial = world.elapsed >= world.tutorialSecs;
    const { spd, gapMax } = getDifficulty();
    if (afterTutorial) world.scroll = spd;

    // segment width
    const segW = Math.floor(80 + RNG.rand()*160); // 80–240
    // yTop with occasional low ceiling "spike" bars (post tutorial)
    const yTop = world.floorY + (RNG.rand()<0.1 && afterTutorial ? Math.floor(-10 - RNG.rand()*20) : 0);
    world.segments.push({ x: world.lastSegX, w: segW, yTop });

    // maybe spawn items/aliens on this segment (post tutorial)
    if (afterTutorial) {
      // chips
      if (RNG.rand() < 0.6) {
        const n = 1 + (RNG.rand()<0.25?1:0);
        for (let i=0;i<n;i++) {
          const ix = world.lastSegX + 10 + RNG.rand()*(segW-20);
          const iy = yTop - 16 - (i*12);
          world.items.push({ type:"chip", x: ix, y: iy, w:10, h:10 });
        }
      }
      // rare powerups
      if (RNG.rand() < 0.08) {
        const ix = world.lastSegX + 10 + RNG.rand()*(segW-22);
        const iy = yTop - 18;
        world.items.push({ type:"shield", x: ix, y: iy, w:12, h:12 });
      } else if (RNG.rand() < 0.08) {
        const ix = world.lastSegX + 10 + RNG.rand()*(segW-22);
        const iy = yTop - 18;
        world.items.push({ type:"slow", x: ix, y: iy, w:12, h:12 });
      }
      // aliens: not within 2 tiles of edges (~32px each tile here)
      if (RNG.rand() < 0.35 && segW > 100) {
        const safeEdge = 64;
        const ax = world.lastSegX + safeEdge + RNG.rand()*(segW - safeEdge*2);
        const ay = yTop - 14;
        world.entities.push({ x: ax, y: ay, w:22, h:14, dir: RNG.rand()<0.5?-1:1, minX: world.lastSegX+safeEdge, maxX: world.lastSegX+segW-safeEdge, t:0 });
      }
    }

    world.lastSegX += segW;

    // gap
    const gapMin = 20;
    const gap = Math.floor(gapMin + RNG.rand()*(afterTutorial ? gapMax : 35));
    world.lastSegX += gap;
  }
}

/* ===========================================================
   ========================== INPUT ==========================
   Keyboard + mobile pads; jump buffer & coyote
   =========================================================== */
const input = {
  left: false, right: false, jump: false,
  lastJumpPressedAt: -1,
};

window.addEventListener('keydown', (e) => {
  if (e.repeat) return;
  switch (e.code) {
    case 'ArrowLeft': case 'KeyA': input.left = true; break;
    case 'ArrowRight': case 'KeyD': input.right = true; break;
    case 'ArrowUp': case 'KeyW': case 'Space':
      input.jump = true; input.lastJumpPressedAt = performance.now(); e.preventDefault(); break;
    case 'Escape':
      if (game.state === 'play') setPaused(true);
      else if (game.state === 'pause') setPaused(false);
      break;
    case 'KeyM': toggleSound(); break;
    case 'KeyF': toggleFullscreen(); break;
  }
});
window.addEventListener('keyup', (e) => {
  switch (e.code) {
    case 'ArrowLeft': case 'KeyA': input.left = false; break;
    case 'ArrowRight': case 'KeyD': input.right = false; break;
    case 'ArrowUp': case 'KeyW': case 'Space': input.jump = false; break;
  }
});

/* Mobile pads */
function bindPad(btn, on, off) {
  const start = (e)=>{ e.preventDefault(); on(); };
  const end = (e)=>{ e.preventDefault(); off(); };
  btn.addEventListener('pointerdown', start);
  btn.addEventListener('pointerup', end);
  btn.addEventListener('pointerleave', end);
  btn.addEventListener('pointercancel', end);
  btn.addEventListener('touchstart', start, {passive:false});
  btn.addEventListener('touchend', end);
}
bindPad(document.getElementById('btnLeft'), ()=>input.left=true, ()=>input.left=false);
bindPad(document.getElementById('btnRight'), ()=>input.right=true, ()=>input.right=false);
bindPad(document.getElementById('btnJump'), ()=>{
  input.jump = true; input.lastJumpPressedAt = performance.now();
  // simulate quick tap buffer
  setTimeout(()=> input.jump = false, 180);
}, ()=> input.jump = false);

/* ===========================================================
   =================== PHYSICS & PLAYER ======================
   Gravity, friction, coyote (120ms), jump buffer (120ms)
   =========================================================== */
const physics = {
  g: 0.65,
  jumpV: 11.5,
  friction: 0.86,
  coyoteMs: 120,
  bufferMs: 120
};

const player = {
  x: Math.floor(W*0.25), y: 0, w:16, h:22,
  vx: 0, vy: 0,
  onGround: false, lastGroundedAt: 0,
  hasShield: false,
  score: 0, best: 0
};

/* Terrain collision check: returns topY if under player, else null */
function groundYAt(x) {
  for (const s of world.segments) {
    if (x >= s.x && x <= s.x+s.w) return s.yTop;
  }
  return null;
}

/* AABB collision */
function overlap(a,b){ return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y; }

/* ===========================================================
   ====================== UPDATE =============================
   Game loop update: world, entities, items, player
   =========================================================== */
const game = {
  state: 'title', // 'title' | 'play' | 'pause' | 'over'
  lastTime: 0,
  dpr: 1
};
const centerOverlay = document.getElementById('centerOverlay');
const titleBlock = document.getElementById('titleBlock');
const hud = document.getElementById('hud');

function setPaused(p) {
  if (p) {
    game.state = 'pause';
    centerOverlay.style.display = 'grid';
    centerOverlay.innerHTML = `<div class="titleBlock"><div class="titleMain">PAUSED</div><div class="smallNote">Esc to resume</div></div>`;
  } else {
    game.state = 'play';
    centerOverlay.style.display = 'none';
  }
}

function setGameOver() {
  game.state = 'over';
  centerOverlay.style.display = 'grid';
  centerOverlay.innerHTML = `<div class="titleBlock"><div class="titleMain">GAME OVER</div><div class="smallNote">Space/Enter to retry</div></div>`;
}

function startGame() {
  // reset player & world
  const best = Number(localStorage.getItem('moon_best')||0);
  player.best = isFinite(best)?best:0;
  player.x = Math.floor(W*0.25); player.y = 0; player.vx = 0; player.vy = 0;
  player.onGround = false; player.lastGroundedAt = 0; player.score = 0; player.hasShield = false;
  resetWorld();
  game.state = 'play';
  centerOverlay.style.display = 'none';
  AudioSys.tone('square', 660, 0.08, 0.2);
}

window.addEventListener('keydown', (e) => {
  if (game.state === 'title' && (e.code === 'Space' || e.code === 'Enter')) startGame();
  else if (game.state === 'over' && (e.code === 'Space' || e.code === 'Enter')) startGame();
});

/* ===========================================================
   ======================== DRAW =============================
   Parallax stars, world, entities, items, HUD & overlays
   =========================================================== */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', {alpha:false, desynchronized:true});
ctx.imageSmoothingEnabled = false;

function applyDPR() {
  const rawDPR = Math.min(2, window.devicePixelRatio || 1);
  if (rawDPR !== game.dpr) {
    game.dpr = rawDPR;
    canvas.width = W * game.dpr;
    canvas.height = H * game.dpr;
    ctx.setTransform(game.dpr,0,0,game.dpr,0,0);
    ctx.imageSmoothingEnabled = false;
  } else {
    ctx.setTransform(game.dpr,0,0,game.dpr,0,0);
  }
}
applyDPR();
window.addEventListener('resize', applyDPR);

/* Title scene deco: UFO hover + astronaut under beam (flicker) */
let titleBeamOn = true, titleBeamT = 0;

function drawTitleScene() {
  // backdrop
  ctx.fillStyle = "#000"; ctx.fillRect(0,0,W,H);
  // stars (static for title)
  for (const s of world.starsA) { ctx.fillStyle="#fff"; ctx.fillRect(s.x|0, s.y|0, 1,1); }
  for (const s of world.starsB) { ctx.fillStyle="#fff"; ctx.fillRect(s.x|0, s.y|0, 1,1); }
  // UFO above title
  const ufx = Math.floor(W/2 - 28), ufy = Math.floor(H*0.28);
  drawUFO(ctx, ufx, ufy, titleBeamOn);
  // astronaut below beam
  drawAstronaut(ctx, Math.floor(W/2 - 8), Math.floor(ufy + 32), "idle");
}

/* Main rendering */
function render() {
  // clear
  ctx.fillStyle = "#000"; ctx.fillRect(0,0,W,H);

  // Parallax stars
  ctx.fillStyle = "#fff";
  for (const s of world.starsA) ctx.fillRect(s.x|0, s.y|0, 1,1);
  for (const s of world.starsB) ctx.fillRect(s.x|0, s.y|0, 1,1);

  // ground
  for (const seg of world.segments) {
    drawGroundSegment(ctx, seg.x|0, seg.yTop|0, seg.w|0);
  }

  // items
  for (const it of world.items) {
    if (it.type === 'chip') drawChip(ctx, it.x|0, it.y|0);
    else if (it.type === 'shield') drawShield(ctx, it.x|0, it.y|0);
    else drawSlow(ctx, it.x|0, it.y|0);
  }

  // aliens
  const wobble = ((world.time*8)|0)%2 === 0;
  for (const en of world.entities) drawAlien(ctx, en.x|0, en.y|0, wobble);

  // player
  const frame =
    !player.onGround ? "jump" :
    (Math.abs(player.vx) > 0.5 ? ( ((world.time*12)|0)%2 ? "run1":"run2") : "idle");
  drawAstronaut(ctx, player.x|0, (player.y|0), frame);

  // If slow-mo active, add subtle indicator bars at top
  if (world.slowMoUntil > performance.now()) {
    for (let i=0;i<W;i+=8) ctx.fillRect(i, 0, 4, 2);
  }
}

/* HUD */
function updateHUD() {
  const sc = player.score|0;
  const be = player.best|0;
  hud.textContent = `SCORE ${String(sc).padStart(5,'0')}  BEST ${String(be).padStart(5,'0')}`;
}

/* ===========================================================
   ========================= LOOP ============================
   Fixed-ish timestep using delta; cleans offscreen
   =========================================================== */
function step(ts) {
  if (!game.lastTime) game.lastTime = ts;
  const rawDt = Math.min(50, ts - game.lastTime); // clamp
  game.lastTime = ts;

  // speed factor & slow-mo
  let timeScale = world.speedFactor;
  if (world.slowMoUntil > performance.now()) timeScale *= 0.6;

  const dt = rawDt * (timeScale/16.6667); // normalize ~60fps

  // Title or overlays
  if (game.state === 'title') {
    titleBeamT += dt;
    if (titleBeamT > 6) { titleBeamT = 0; titleBeamOn = !titleBeamOn; }
    drawTitleScene();
    updateHUD(); // show best on title
    requestAnimationFrame(step);
    return;
  }
  if (game.state === 'pause') {
    render(); updateHUD();
    requestAnimationFrame(step);
    return;
  }

  // ======= Update world =======
  world.time += dt;
  world.elapsed += dt/60;

  // parallax motion
  const sA = world.scroll*0.3*dt, sB = world.scroll*0.6*dt, sG = world.scroll*dt;
  for (const s of world.starsA) { s.x -= sA; if (s.x < 0) s.x += W; }
  for (const s of world.starsB) { s.x -= sB; if (s.x < 0) s.x += W; }

  // spawn ground ahead
  spawnAhead(W + 400 + (-world.segments.at(-1)?.x || 0) + world.lastSegX);

  // scroll segments/items/entities
  const offX = sG;
  for (const seg of world.segments) seg.x -= offX;
  for (const it of world.items) it.x -= offX;
  for (const en of world.entities) {
    en.x -= offX;
    // patrol within [minX,maxX] in world space => we subtract offX equally each frame,
    // so patrol vector applies in screen-space:
    en.t += dt;
    if (en.t > 0.5) { en.t = 0; en.dir *= (Math.random()<0.2?-1:1); } // subtle switches
    en.x += en.dir * 0.8 * dt; // slow patrol
    if (en.x < en.minX - world.segments[0]?.x) en.dir = 1;
    if (en.x+en.w > en.maxX - world.segments[0]?.x) en.dir = -1;
  }

  // clean off-screen
  world.segments = world.segments.filter(s => s.x + s.w > -200);
  world.items = world.items.filter(it => it.x + it.w > -50);
  world.entities = world.entities.filter(en => en.x + en.w > -100);

  // ======= Update player =======
  // horizontal input
  if (input.left && !input.right) player.vx -= 0.6*dt;
  else if (input.right && !input.left) player.vx += 0.6*dt;
  else player.vx *= Math.pow(physics.friction, dt); // friction with dt

  // clamp vx
  player.vx = Math.max(-4.5, Math.min(4.5, player.vx));

  // gravity
  player.vy += physics.g * dt;

  // coyote ground detection
  const feetX = player.x + player.w/2;
  const groundTop = groundYAt(feetX);
  let onGroundNow = false;
  if (groundTop !== null) {
    // simple ground collide when feet touch top
    const feet = player.y + player.h;
    if (feet >= groundTop && player.vy >= 0) {
      player.y = groundTop - player.h;
      player.vy = 0;
      onGroundNow = true;
    }
  }

  if (onGroundNow) player.lastGroundedAt = performance.now();
  player.onGround = onGroundNow;

  // jump buffer/coyote
  const now = performance.now();
  const canCoyote = (now - player.lastGroundedAt) <= physics.coyoteMs;
  const buffered = (now - input.lastJumpPressedAt) <= physics.bufferMs;

  if ((input.jump || buffered) && (player.onGround || canCoyote)) {
    player.vy = -physics.jumpV;
    input.lastJumpPressedAt = -1; // consume buffer
    AudioSys.tone('square', 520, 0.06, 0.18);
  }

  // move
  player.x += player.vx * dt;
  player.y += player.vy * dt;

  // prevent going off top/bottom hard
  if (player.y > H+40) { // fell into crater -> hit/death
    playerHit();
  }

  // collisions with items
  const pBox = { x: player.x, y: player.y, w: player.w, h: player.h };
  for (let i=world.items.length-1;i>=0;i--) {
    const it = world.items[i];
    if (overlap(pBox, it)) {
      if (it.type === 'chip') {
        player.score += 100;
        AudioSys.tone('square', 800, 0.05, 0.25);
      } else if (it.type === 'shield') {
        player.hasShield = true;
        AudioSys.tone('square', 360, 0.08, 0.25);
        AudioSys.tone('square', 540, 0.08, 0.2);
      } else {
        world.slowMoUntil = performance.now() + 3000;
        AudioSys.tone('square', 300, 0.06, 0.22);
        setTimeout(()=>AudioSys.tone('square', 420, 0.06, 0.2), 80);
      }
      world.items.splice(i,1);
    }
  }

  // collisions with aliens
  for (const en of world.entities) {
    if (overlap(pBox, en)) {
      if (player.hasShield) {
        player.hasShield = false; // consume shield
        // knockback a little
        player.vy = -6; player.vx *= -0.5;
        AudioSys.tone('square', 180, 0.06, 0.25);
      } else {
        playerHit();
        break;
      }
    }
  }

  // score increases with distance/time
  player.score += (0.8 + world.scroll*0.1) * dt;

  // ======= Render & HUD =======
  render();
  updateHUD();

  requestAnimationFrame(step);
}

function playerHit() {
  AudioSys.tone('square', 140, 0.1, 0.25);
  setTimeout(()=>AudioSys.tone('square', 100, 0.14, 0.25), 60);
  const sc = Math.floor(player.score);
  if (sc > player.best) {
    player.best = sc;
    localStorage.setItem('moon_best', String(sc));
  }
  setGameOver();
}

/* Start in title state */
(function boot(){
  // load best
  const best = Number(localStorage.getItem('moon_best')||0);
  player.best = isFinite(best)?best:0;
  resetWorld();
  drawTitleScene();
  updateHUD();
  requestAnimationFrame(step);
})();

/* ===========================================================
   ====================== UI / TOOLBAR =======================
   Sound, contrast, fullscreen, speed ±5%
   =========================================================== */
const root = document.getElementById('root');
const btnSound = document.getElementById('btnSound');
const btnContrast = document.getElementById('btnContrast');
const btnFullscreen = document.getElementById('btnFullscreen');
const speedMinus = document.getElementById('speedMinus');
const speedPlus = document.getElementById('speedPlus');
const speedVal = document.getElementById('speedVal');

function updateSpeedLabel(){
  speedVal.textContent = `${Math.round(world.speedFactor*100)}%`;
}
function toggleSound(){
  const on = AudioSys.toggle();
  btnSound.textContent = (on? "🔊 Sound":"🔇 Sound");
}
function toggleContrast(){
  root.classList.toggle('invert');
}
async function toggleFullscreen(){
  const el = document.documentElement;
  if (!document.fullscreenElement) await el.requestFullscreen().catch(()=>{});
  else await document.exitFullscreen().catch(()=>{});
}
btnSound.addEventListener('click', toggleSound);
btnContrast.addEventListener('click', toggleContrast);
btnFullscreen.addEventListener('click', toggleFullscreen);
speedMinus.addEventListener('click', ()=>{ world.speedFactor = Math.max(0.5, Math.round((world.speedFactor-0.05)*100)/100); updateSpeedLabel(); });
speedPlus.addEventListener('click', ()=>{ world.speedFactor = Math.min(1.5, Math.round((world.speedFactor+0.05)*100)/100); updateSpeedLabel(); });
updateSpeedLabel();

/* Start/click on canvas to begin from title */
canvas.addEventListener('pointerdown', ()=>{
  if (game.state === 'title') startGame();
  else if (game.state === 'over') startGame();
});

/* Prevent touch scroll on pads */
document.getElementById('pads').addEventListener('touchmove', e => e.preventDefault(), {passive:false});
</script>
