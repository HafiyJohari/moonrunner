<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Moon Runner — Simple B/W Pixel Game</title>
<style>
  /* Widescreen canvas with crisp pixels */
  :root { --w: 960; --h: 540; }
  html, body { margin:0; height:100%; background:#000; color:#fff; font-family:system-ui, sans-serif; }
  .wrap {
    display:grid; place-items:center; height:100%;
    gap:12px; padding:12px;
  }
  canvas {
    width:min(96vw, 96vh * (16/9));
    height:calc(var(--h) * (min(96vw, 96vh * (16/9)) / var(--w)));
    image-rendering: pixelated; image-rendering: crisp-edges;
    outline:1px solid #fff2;
    background:#000;
  }
  .hud { font-size:14px; opacity:.9; text-align:center; }
  .hud b { color:#fff; }
</style>
</head>
<body>
<div class="wrap">
  <canvas id="game" width="960" height="540"></canvas>
  <div class="hud">
    <b>Controls:</b> A/D or ◀ ▶ to move, W or Space to jump. Reach the UFO. Avoid pits.<br/>
    <b>Style:</b> 1-bit (black & white), crisp pixels, no anti-aliasing.
  </div>
</div>

<script>
/* ====== Minimal B/W Side-Scroller (Canvas) ====== */
const c = document.getElementById('game');
const ctx = c.getContext('2d', { alpha:false });
ctx.imageSmoothingEnabled = false;

// ----- World settings (all units are "pixels") -----
const W = c.width, H = c.height;
const GRAV = 0.7, FRICTION = 0.82, MOVE = 0.9, JUMP = 12;
const CAMERA_LAG = 0.1;

// Mono palette
const BLACK = "#000";
const WHITE = "#fff";

// Helper draw
const fill = (x,y,w,h,color=WHITE)=>{ ctx.fillStyle=color; ctx.fillRect(Math.floor(x),Math.floor(y),Math.floor(w),Math.floor(h)); };

// Simple RNG
let seed = 42; const rand = () => (seed = (seed*1664525+1013904223)|0, ((seed>>>0)%1000)/1000);

// ----- Build a tiny level: platforms and gaps -----
const platforms = [];
(function makeLevel(){
  // Ground segments across a long strip with occasional gaps (moon craters)
  let x = 0;
  const groundY = H - 80;
  for (let i=0;i<30;i++){
    const segW = 240 + Math.floor(rand()*160);
    const gap = 50 + Math.floor(rand()*70); // gaps between segments
    platforms.push({ x, y:groundY, w:segW, h:40, type:'ground' });
    x += segW + gap;
  }
  // A few elevated ledges
  platforms.push({ x: 700,  y: groundY-120, w: 120, h: 16, type:'ledge' });
  platforms.push({ x: 1200, y: groundY-170, w: 100, h: 16, type:'ledge' });
  platforms.push({ x: 1650, y: groundY-140, w: 140, h: 16, type:'ledge' });
  // End goal platform
  const endX = platforms[platforms.length-1].x + platforms[platforms.length-1].w + 120;
  platforms.push({ x:endX, y:groundY-40, w:180, h:40, type:'pad' });
})();

// Simple patrolling alien (rectangle)
const aliens = [
  { x: 820, y: H-80-14, w: 22, h: 14, vx: 0.6, left: 780, right: 900 },
  { x: 1320, y: H-80-14, w: 22, h: 14, vx: -0.7, left: 1280, right: 1360 }
];

// Player
const player = { x: 40, y: H-140, w: 16, h: 22, vx:0, vy:0, onGround:false, dead:false, won:false };

// UFO goal
const goal = (()=>{
  const lastPad = platforms.find(p=>p.type==='pad');
  return { x:lastPad.x+100, y:lastPad.y-80, r:28 };
})();

// Camera
let camX = 0;

// Input
const keys = {};
addEventListener('keydown', e=>{
  if(['ArrowLeft','ArrowRight','ArrowUp',' ' , 'a','d','w','A','D','W'].includes(e.key)) e.preventDefault();
  keys[e.key] = true;
});
addEventListener('keyup', e=> keys[e.key] = false );

// Collision utility
function rects(a,b){ return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y; }

// Physics + world step
function step(){
  if(player.dead || player.won) return;

  // Horizontal input
  const left  = keys['ArrowLeft'] || keys['a'] || keys['A'];
  const right = keys['ArrowRight']|| keys['d'] || keys['D'];
  const up    = keys['ArrowUp']   || keys['w'] || keys['W'] || keys[' '];
  if(left)  player.vx -= MOVE;
  if(right) player.vx += MOVE;

  // Gravity
  player.vy += GRAV;

  // Jump (only when grounded)
  if(up && player.onGround){ player.vy = -JUMP; player.onGround=false; }

  // Apply movement
  player.x += player.vx;
  player.y += player.vy;
  player.vx *= FRICTION;

  // Floor death (pit)
  if(player.y > H+100) player.dead = true;

  // Platform collisions (AABB, resolve Y first)
  player.onGround = false;
  for(const p of platforms){
    // Only check nearby
    if(p.x + p.w < player.x-100 || p.x > player.x+player.w+100) continue;

    // Vertical resolve
    if(rects(player, p)){
      if(player.vy > 0 && player.y+player.h - player.vy <= p.y){ // landing
        player.y = p.y - player.h; player.vy = 0; player.onGround = true;
      } else if(player.vy < 0 && player.y - player.vy >= p.y+p.h){ // hit ceiling
        player.y = p.y + p.h; player.vy = 0;
      }
    }
    // Horizontal resolve (simple)
    if(rects(player, p)){
      if(player.vx > 0) player.x = p.x - player.w;
      else if(player.vx < 0) player.x = p.x + p.w;
      player.vx = 0;
    }
  }

  // Aliens patrol + collide (knockout)
  for(const a of aliens){
    a.x += a.vx;
    if(a.x < a.left || a.x+a.w > a.right) a.vx *= -1;
    if(rects(player, a)) player.dead = true;
  }

  // Reach UFO?
  const dx = (player.x + player.w/2) - goal.x;
  const dy = (player.y + player.h/2) - goal.y;
  if(Math.hypot(dx,dy) < goal.r-4) player.won = true;

  // Camera follows
  const target = player.x - W*0.35;
  camX += (target - camX) * CAMERA_LAG;
  camX = Math.max(0, Math.min(camX, 999999)); // trivial clamp
}

// Render (1-bit)
function draw(){
  // Clear
  ctx.fillStyle = BLACK; ctx.fillRect(0,0,W,H);

  // Star field (static pattern)
  ctx.fillStyle = WHITE;
  for(let i=0;i<120;i++){
    const sx = (i*83)%2000 - camX*0.2; // parallax
    const sy = (i*131)%H;
    const x = Math.floor(sx % (W+200)) - 100;
    const y = Math.floor(sy);
    if(x>=0 && x<W && y>=0 && y<H) ctx.fillRect(x,y,1,1);
  }

  // Moon horizon
  fill(-camX, H-120, W+camX+2000, 2, WHITE);

  // Platforms
  for(const p of platforms){
    const x = Math.floor(p.x - camX), y = p.y;
    if(x+p.w < -50 || x > W+50) continue;
    // top
    fill(x, y, p.w, p.h, WHITE);
    // texture (simple dither blocks)
    for(let i=0;i<p.w;i+=8){
      for(let j=0;j<p.h;j+=8){
        if(((i+j)>>3)&1) fill(x+i, y+j, 4, 4, BLACK);
      }
    }
  }

  // Aliens
  for(const a of aliens){
    const x = Math.floor(a.x - camX), y = Math.floor(a.y);
    fill(x, y, a.w, a.h, WHITE);                // body
    fill(x+4, y+4, 4, 4, BLACK);                // eye
  }

  // Player (helmet silhouette)
  const px = Math.floor(player.x - camX), py = Math.floor(player.y);
  fill(px, py, player.w, player.h, WHITE);
  fill(px+4, py+6, 6, 6, BLACK); // visor

  // UFO goal (beam)
  const gX = Math.floor(goal.x - camX), gY = Math.floor(goal.y);
  // beam
  for(let i=0;i<50;i+=2) fill(gX-6+i%12-6, gY+12+i, 12, 2, (i%4===0)?WHITE:BLACK);
  // saucer
  fill(gX-28, gY, 56, 8, WHITE);
  fill(gX-22, gY-10, 44, 6, WHITE);
  fill(gX-3, gY-18, 6, 6, WHITE); // tiny dome

  // UI
  ctx.fillStyle = WHITE;
  ctx.fillRect(10,10,1,8); // tiny tick for retro vibe

  ctx.font = "12px monospace";
  ctx.fillStyle = WHITE;
  if(player.dead){
    const msg = "YOU FELL INTO A CRATER — PRESS R TO RESTART";
    ctx.fillText(msg, Math.floor(W/2 - ctx.measureText(msg).width/2), 40);
  } else if(player.won){
    const msg = "BOARD THE UFO — YOU WIN!  PRESS R TO RESTART";
    ctx.fillText(msg, Math.floor(W/2 - ctx.measureText(msg).width/2), 40);
  }
}

// Restart
function reset(){
  player.x = 40; player.y = H-140; player.vx=0; player.vy=0;
  player.onGround=false; player.dead=false; player.won=false;
  camX = 0;
}
addEventListener('keydown', e=>{ if(e.key==='r' || e.key==='R') reset(); });

// Main loop
function loop(){
  step();
  draw();
  requestAnimationFrame(loop);
}
reset(); loop();
</script>
</body>
</html>
