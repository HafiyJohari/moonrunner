<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MKHKASG: MoonRunner — 1-bit Endless</title>

<!-- Title/HUD font -->
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
  :root { --w: 960; --h: 540; }
  html,body{margin:0;height:100%;background:#000;color:#fff;font-family:ui-monospace,Consolas,Menlo,monospace}
  body.invert{background:#fff;color:#000}
  .wrap{display:grid;place-items:center;height:100%;gap:8px;padding:10px}
  canvas{
    width:min(96vw,96vh*(16/9));
    height:calc(var(--h) * (min(96vw,96vh*(16/9)) / var(--w)));
    image-rendering:pixelated; image-rendering:crisp-edges;
    background:transparent; outline:1px solid #ffffff22;
  }
  .hud{width:min(96vw,96vh*(16/9));display:flex;justify-content:space-between;align-items:center;font-size:12px;opacity:.95}
  .hud .left,.hud .right{display:flex;gap:10px;align-items:center}
  .btn{padding:3px 8px;border:1px solid currentColor;cursor:pointer;user-select:none}
  .btn:active{transform:translateY(1px)}
  /* Mobile onscreen controls */
  .mobile{position:fixed;inset:auto 0 10px 0;display:none;justify-content:space-between;pointer-events:none;width:100%;padding:0 8px}
  .pad{pointer-events:auto;background:#000;color:#fff;opacity:.85;border:1px solid #fff;border-radius:12px;width:31vw;height:16vh;display:flex;align-items:center;justify-content:center;font-size:18px;touch-action:none}
  .jump{width:31vw;height:16vh}
  @media (max-width: 820px){ .mobile{display:flex} .hud .right{display:none} }
</style>
</head>
<body>
<div class="wrap">
  <canvas id="cv" width="960" height="540"></canvas>
  <div class="hud">
    <div class="left"><span id="status">Ready</span> <span>•</span> <span>←/→ move • W/↑/Space jump • Esc pause</span></div>
    <div class="right">
      <div id="mute" class="btn">🔈 Sound</div>
      <div id="invert" class="btn">⬛/⬜ Contrast</div>
      <div id="fs" class="btn">⛶ Full</div>
      <div id="speeddown" class="btn">–Speed</div>
      <div id="speedup" class="btn">+Speed</div>
    </div>
  </div>
</div>

<!-- Mobile buttons -->
<div class="mobile">
  <div style="display:flex;gap:8px;padding-left:8px;">
    <div id="btnLeft" class="pad">◀</div>
    <div id="btnRight" class="pad">▶</div>
  </div>
  <div style="padding-right:8px;">
    <div id="btnJump" class="pad jump">⤒</div>
  </div>
</div>

<script>
/* ===========================================================
   MKHKASG: MoonRunner — manual-move endless (1-bit, single file)
   =========================================================== */
/* ---------- Canvas & DPR ---------- */
const CV = document.getElementById('cv');
const ctx = CV.getContext('2d', { alpha:false });
ctx.imageSmoothingEnabled = false;

const W = 960, H = 540;
let DPR = 1;
function resizeCanvas(){
  DPR = Math.min(2, Math.max(1, window.devicePixelRatio||1));
  CV.width = (W*DPR)|0; CV.height = (H*DPR)|0;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.imageSmoothingEnabled = false;
}
addEventListener('resize', resizeCanvas); resizeCanvas();

/* ---------- Colors & helpers ---------- */
function inverted(){ return document.body.classList.contains('invert'); }
function FG(){ return inverted() ? '#000' : '#fff'; }
function BG(){ return inverted() ? '#fff' : '#000'; }
const FILL = (x,y,w,h,col)=>{ ctx.fillStyle=col; ctx.fillRect(x|0,y|0,w|0,h|0); };

/* ---------- Sound ---------- */
let audio=null, muted=false;
function beep(kind='jump'){
  if(muted) return;
  if(!audio) audio = new (window.AudioContext||window.webkitAudioContext)();
  const o=audio.createOscillator(), g=audio.createGain();
  o.type='square'; const now=audio.currentTime;
  const tbl={jump:[440,220,.13,.06], coin:[660,440,.12,.06], hit:[110,55,.16,.07], win:[523,659,.18,.08]};
  const [f1,f2,dur,vol]=tbl[kind]||tbl.jump;
  o.frequency.setValueAtTime(f1,now); o.frequency.exponentialRampToValueAtTime(f2,now+dur);
  g.gain.setValueAtTime(vol,now); g.gain.exponentialRampToValueAtTime(0.0001,now+dur);
  o.connect(g); g.connect(audio.destination); o.start(); o.stop(now+dur);
}

/* ---------- RNG ---------- */
let seed=20251027;
const RND=()=> (seed=(seed*1664525+1013904223)>>>0, (seed%1000)/1000);

/* ---------- State ---------- */
let state='menu'; // menu | play | paused | over
let score=0, best=Number(localStorage.getItem('moon_best')||0);
let baseSpeed=2.8, time=0, scroll=0;
const statusEl=document.getElementById('status');

/* ---------- Input ---------- */
const keys={};
addEventListener('keydown',e=>{
  if(['ArrowLeft','ArrowRight','ArrowUp',' ','w','W','a','A','d','D','Escape','Enter'].includes(e.key)) e.preventDefault();
  keys[e.key]=true;
  if(e.key==='Escape'){ state=(state==='play'?'paused':'play'); statusEl.textContent=state==='paused'?'Paused':'Running…'; }
  if(state==='menu'&&(e.key===' '||e.key==='Enter'||e.key==='ArrowUp'||e.key==='w'||e.key==='W')) start();
  if(state==='over'&&(e.key===' '||e.key==='Enter'||e.key==='r'||e.key==='R')) start();
});
addEventListener('keyup',e=> keys[e.key]=false);

/* Touch pads */
function bindTouch(id,on,off){
  const el=document.getElementById(id);
  const down=ev=>{ev.preventDefault();on();};
  const up=ev=>{ev.preventDefault();off();};
  el.addEventListener('touchstart',down,{passive:false});
  el.addEventListener('touchend',up,{passive:false});
  el.addEventListener('touchcancel',up,{passive:false});
}
bindTouch('btnLeft', ()=>keys['ArrowLeft']=true, ()=>keys['ArrowLeft']=false);
bindTouch('btnRight',()=>keys['ArrowRight']=true,()=>keys['ArrowRight']=false);
bindTouch('btnJump', ()=>{ keys[' ']=true; jumpBufferUntil=performance.now()+JUMP_BUFFER_MS; }, ()=>keys[' ']=false);

/* Toolbar */
document.getElementById('mute').onclick = ()=>{ muted=!muted; event.currentTarget.textContent=muted?'🔇 Muted':'🔈 Sound'; };
document.getElementById('invert').onclick = ()=> document.body.classList.toggle('invert');
document.getElementById('fs').onclick = ()=> CV.requestFullscreen?.();
document.getElementById('speedup').onclick = ()=>{ baseSpeed=Math.min(7, baseSpeed*1.05); statusEl.textContent=`Speed ${baseSpeed.toFixed(2)}`; };
document.getElementById('speeddown').onclick = ()=>{ baseSpeed=Math.max(2, baseSpeed*0.95); statusEl.textContent=`Speed ${baseSpeed.toFixed(2)}`; };

/* ---------- World ---------- */
const floorY = H-84;
let segments=[], entities=[], items=[];

/* ---------- Player & physics ---------- */
const GRAV=0.65, JUMP=11.6, FRICTION=0.86;
const COYOTE_MS=120, JUMP_BUFFER_MS=120;
const player={x:120,y:floorY-22,w:16,h:22,vx:0,vy:0,on:false,shield:0,slow:0};
let coyoteUntil=0, jumpBufferUntil=0;

/* ---------- Difficulty ---------- */
function getDiff(){
  const t = Math.min(1, (time/16000) + (score/2200));
  const scrollFactor = 0.6 * (player.slow>0 ? 0.6 : 1);
  const worldScroll = (baseSpeed + t*1.2) * scrollFactor;
  const gapMin = 24;
  const gapMax = 35 + Math.min(60, t*60); // ~35→95 across run
  const gMin = (time<10000 ? 260 : 180 - t*20);
  const gMax = gMin + 140;
  return {t, worldScroll, gapMin, gapMax, gMin, gMax};
}

/* ---------- Gen ---------- */
function resetWorld(){
  segments=[]; entities=[]; items=[]; scroll=0; time=0; score=0;
  Object.assign(player,{x:120,y:floorY-22,vx:0,vy:0,on:false,shield:0,slow:0});
  segments.push({x:0,w:380,type:'ground'}); // long runway
  spawnAhead(W*2.4);
}
function lastEnd(){ return segments.length ? segments[segments.length-1].x + segments[segments.length-1].w : 0; }

function spawnAhead(targetX){
  while(lastEnd() < targetX){
    const {t,gapMin,gapMax,gMin,gMax} = getDiff();
    const afterTutorial = (time > 10000);

    const segW = Math.floor(gMin + RND()*(gMax-gMin));
    const gx = lastEnd();
    segments.push({x:gx, w:segW, type:'ground'});

    if(afterTutorial){
      if(RND()<0.22 && segW>120){ // ceiling bar
        const cx = gx + 40 + Math.floor(RND()*(segW-80));
        entities.push({kind:'spike', x:cx, y:floorY-60, w:40, h:10});
      }
      if(RND()<0.5 && segW>100){ // alien patrol
        const ax = gx + 40 + Math.floor(RND()*(segW-100));
        entities.push({kind:'alien', x:ax, y:floorY-14, w:22, h:14, dir:(RND()<0.5?-1:1), baseX:ax, range:36+Math.floor(RND()*44)});
      }
    }

    // Items (coin fix: centered 4x4 hole; snap to ints via |0 when drawing)
    if(RND()<0.6){
      const ix = gx + 30 + Math.floor(RND()*(segW-60));
      items.push({kind:'chip', x:ix, y:floorY-40, w:10, h:10});
    }
    if(afterTutorial && RND()<0.08){
      const ix = gx + segW - 60;
      items.push({kind:(RND()<0.5?'shield':'slow'), x:ix, y:floorY-48, w:12, h:12});
    }

    const gap = afterTutorial ? Math.floor(gapMin + RND()*gapMax)
                              : Math.floor(20 + RND()*30);
    segments.push({x:lastEnd(), w:gap, type:'gap'});
  }
}

/* ---------- Sprites (code masks) ---------- */
function astronaut(x,y,pose='idle'){
  const f=FG(), b=BG();
  // backpack
  FILL(x-3,y+6,3,10,f);
  // body
  FILL(x,y,16,22,f);
  // helmet visor
  FILL(x+5,y+6,6,6,b);
  // legs (pose)
  if(pose==='run1'){ FILL(x+2,y+18,5,2,b); FILL(x+11,y+18,3,2,b); }
  if(pose==='run2'){ FILL(x+1,y+18,4,2,b); FILL(x+9,y+18,6,2,b); }
  if(pose==='jump'){ FILL(x+3,y+18,10,2,b); }
  // tiny shadow under feet (subtle)
  // (kept minimal to stay 1-bit)
}

function alien(x,y,frame=0){
  const f=FG(), b=BG();
  FILL(x,y,22,14,f);
  FILL(x+4,y+4,4,4,b);
  if(frame%2===0) FILL(x+14,y+4,2,2,b); // wobble dot
}

function ufo(x,y,frame=0){
  const f=FG();
  FILL(x-28,y,56,8,f);
  FILL(x-22,y-8,44,6,f);
  FILL(x-4,y-14,8,6,f);
  // beam bars (flicker)
  if(frame%3!==0){ for(let i=0;i<50;i+=4) FILL(x-6+(i%12)-6, y+12+i, 12, 2, f); }
}

/* Tractor beam animation for START cover:
   - soft pulsing cone
   - gentle hovering UFO
   - astronaut bobbing upward a few px, then back */
function drawTractorBeam(cx, cy, t){
  const f=FG();
  // pulse width
  const pulse = (Math.sin(t/340)+1)*0.5; // 0..1
  const halfW = 10 + (pulse*8)|0;        // beam half-width at top
  // "scan lines" going down
  for(let i=0;i<56;i+=4){
    const y = cy + 14 + i;
    const w = halfW + ((i/56)*10)|0;
    FILL(cx - w, y, w*2, 2, f);
  }
}

/* Tiles */
function tileGround(x,y,w){
  const f=FG(), b=BG();
  FILL(x,y,w,44,f);
  for(let i=0;i<w;i+=8) for(let j=0;j<44;j+=8) if(((i+j)>>3)&1) FILL(x+i,y+j,4,4,b);
}

/* ---------- Collisions ---------- */
function AABB(a,b){ return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y; }

/* ---------- Control ---------- */
function start(){ resetWorld(); state='play'; statusEl.textContent='Running…'; beep('coin'); }
function gameOver(){
  state='over';
  best=Math.max(best, Math.floor(score));
  localStorage.setItem('moon_best', String(best));
  statusEl.textContent='Game Over — Space/Enter to retry';
  beep('hit');
}

/* ---------- Update ---------- */
function update(dt){
  if(state!=='play') return;
  time += dt;

  const { worldScroll } = getDiff();
  scroll += worldScroll;

  spawnAhead(scroll + W*2.3);
  const cutoff = scroll - 140;
  segments = segments.filter(s=> s.x + s.w > cutoff);
  entities = entities.filter(e=> e.x + (e.w||0) > cutoff);
  items    = items.filter(i=> i.x + (i.w||0) > cutoff);

  // Inputs
  const left  = keys['ArrowLeft']||keys['a']||keys['A'];
  const right = keys['ArrowRight']||keys['d']||keys['D'];
  const jump  = keys['ArrowUp']||keys['w']||keys['W']||keys[' '];

  if(left)  player.vx -= 0.7;
  if(right) player.vx += 0.7;
  player.vx *= FRICTION;
  player.vy += GRAV;

  const now = performance.now();
  if(player.on) coyoteUntil = now + COYOTE_MS;
  if(jump) jumpBufferUntil = now + JUMP_BUFFER_MS;
  if(jumpBufferUntil>now && coyoteUntil>now){
    player.vy = -JUMP; player.on=false; jumpBufferUntil=0; coyoteUntil=0; beep('jump');
  }

  player.x += player.vx; player.y += player.vy;

  // Platform resolve
  player.on=false;
  const wx = player.x + scroll;
  for(const s of segments){
    if(s.type!=='ground') continue;
    if(wx+player.w < s.x-8 || wx > s.x+s.w+8) continue;
    const a={x:wx,y:player.y,w:player.w,h:player.h}, b={x:s.x,y:floorY,w:s.w,h:48};
    if(AABB(a,b)){
      if(player.vy>0 && player.y+player.h-player.vy<=floorY){
        player.y=floorY-player.h; player.vy=0; player.on=true;
      } else if(player.vy<0 && player.y-player.vy>=floorY+48){
        player.y=floorY+48; player.vy=0;
      } else {
        if(player.vx>0) player.x=(s.x-scroll)-player.w;
        else if(player.vx<0) player.x=(s.x+s.w-scroll);
        player.vx=0;
      }
    }
  }

  // Fall
  if(player.y > H+40){
    if(player.shield>0){ player.shield=0; player.y=floorY-player.h-2; player.vy=-JUMP*0.8; beep('hit'); }
    else gameOver();
  }

  // Entities
  for(const e of entities){
    if(e.kind==='alien'){
      e.x += e.dir*0.7;
      if(Math.abs(e.x - e.baseX) > e.range) e.dir*=-1;
      if(AABB({x:wx,y:player.y,w:player.w,h:player.h},{x:e.x,y:e.y,w:e.w,h:e.h})){
        if(player.shield>0){ player.shield=0; beep('hit'); e.x += (e.dir*-1)*40; }
        else gameOver();
      }
    } else if(e.kind==='spike'){
      if(AABB({x:wx,y:player.y,w:player.w,h:player.h},{x:e.x,y:e.y,w:e.w,h:e.h})){
        if(player.shield>0){ player.shield=0; beep('hit'); } else gameOver();
      }
    }
  }

  // Items
  for(let i=items.length-1;i>=0;i--){
    const it=items[i];
    if(AABB({x:wx,y:player.y,w:player.w,h:player.h},{x:it.x,y:it.y,w:it.w,h:it.h})){
      if(it.kind==='chip'){ score+=100; beep('coin'); }
      if(it.kind==='shield'){ player.shield=1; beep('coin'); }
      if(it.kind==='slow'){ player.slow=180; beep('coin'); }
      items.splice(i,1);
    }
  }

  if(player.slow>0) player.slow--;
  score += dt*0.06 + Math.max(0, player.vx)*0.03;
}

/* ---------- Draw ---------- */
function draw(){
  const f=FG(), b=BG();
  ctx.fillStyle=b; ctx.fillRect(0,0,W,H);

  // Stars parallax
  ctx.fillStyle=f;
  for(let i=0;i<100;i++){
    const x1=((i*83)%2000) - (scroll*0.25 % 2000), y1=(i*131)%H;
    const xx1=((x1+2000)%2000)-100; if(xx1>=0&&xx1<W) ctx.fillRect(xx1|0,y1|0,1,1);
    const x2=((i*211)%2400) - (scroll*0.10 % 2400), y2=(i*97)%H;
    const xx2=((x2+2400)%2400)-100; if(xx2>=0&&xx2<W) ctx.fillRect(xx2|0,y2|0,1,1);
  }

  // Horizon
  FILL(0,floorY-40,W,2,f);

  // Ground
  for(const s of segments){
    if(s.type!=='ground') continue;
    const x=(s.x - scroll)|0, w=s.w|0;
    if(x>W || x+w<-50) continue;
    tileGround(x,floorY,w);
  }

  // Entities
  const frame=(performance.now()/120|0);
  for(const e of entities){
    const x=(e.x - scroll)|0, y=e.y|0;
    if(e.kind==='alien') alien(x,y,frame);
    else if(e.kind==='spike') FILL(x,y,e.w,e.h,f);
  }

  // Items (snap to ints; coin center hole is 4x4 to avoid “line” aliasing)
  for(const it of items){
    const x=(it.x - scroll)|0, y=it.y|0;
    if(it.kind==='chip'){ FILL(x,y,10,10,f); FILL(x+3,y+3,4,4,b); }
    if(it.kind==='shield'){ FILL(x,y,12,12,f); FILL(x+2,y+2,8,8,b); }
    if(it.kind==='slow'){ FILL(x,y,12,12,f); FILL(x+2,y+5,8,2,b); }
  }

  // Player
  const pose = player.on ? (frame%2?'run1':'run2') : (player.vy<0?'jump':'idle');
  astronaut(player.x|0, player.y|0, pose);
  if(player.shield>0){
    FILL(player.x-2,player.y-2, player.w+4,2,f);
    FILL(player.x-2,player.y+player.h, player.w+4,2,f);
    FILL(player.x-2,player.y-2,2,player.h+4,f);
    FILL(player.x+player.w,player.y-2,2,player.h+4,f);
  }

  // HUD
  ctx.fillStyle=f;
  ctx.font="12px 'Press Start 2P', monospace";
  const hud=`SCORE ${Math.floor(score).toString().padStart(5,'0')}    BEST ${best.toString().padStart(5,'0')}`;
  ctx.fillText(hud,10,18);

  if(state==='menu'){
    // Poster cover with animated tractor beam
    const t = performance.now();
    const cx = W/2|0, cy = (H*0.30)|0;
    // hover UFO slightly
    const hover = Math.sin(t/600)*3;
    ufo(cx, cy-40+hover, frame);
    drawTractorBeam(cx, cy-40+hover, t);
    // astronaut gently pulled up & down
    const pull = (Math.sin(t/700+1.2)*4)|0;
    astronaut(cx-8, cy+18-pull, 'idle');

    const title="MKHKASG: MOONRUNNER";
    ctx.font="22px 'Press Start 2P', monospace";
    const tw=ctx.measureText(title).width;
    ctx.fillText(title, ((W-tw)/2)|0, cy+64);

    ctx.font="10px 'Press Start 2P', monospace";
    const t1="Press SPACE to start • ←/→ move • W/↑/Space jump • Esc pause";
    const t2="Goal: survive. Chips +100. Shield = 1 hit. Slow-mo = 3s.";
    ctx.fillText(t1, ((W-ctx.measureText(t1).width)/2)|0, cy+86);
    ctx.fillText(t2, ((W-ctx.measureText(t2).width)/2)|0, cy+104);
  }

  if(state==='paused'){
    ctx.font="12px 'Press Start 2P', monospace";
    const msg="PAUSED — Esc to resume";
    ctx.fillText(msg, ((W-ctx.measureText(msg).width)/2)|0, H*0.5);
  }
  if(state==='over'){
    ctx.font="14px 'Press Start 2P', monospace";
    const msg="GAME OVER", tip="Space/Enter to retry";
    ctx.fillText(msg, ((W-ctx.measureText(msg).width)/2)|0, H*0.45);
    ctx.font="10px 'Press Start 2P', monospace";
    ctx.fillText(tip, ((W-ctx.measureText(tip).width)/2)|0, H*0.45+24);
  }
}

/* ---------- Loop ---------- */
function start(){ resetWorld(); state='play'; statusEl.textContent='Running…'; beep('coin'); }
function gameOver(){ state='over'; best=Math.max(best,Math.floor(score)); localStorage.setItem('moon_best',String(best)); statusEl.textContent='Game Over — Space/Enter to retry'; beep('hit'); }

let last=performance.now();
function loop(now){
  const dt=Math.min(33, now-last); last=now;
  if(state==='play') update(dt);
  draw();
  requestAnimationFrame(loop);
}
resetWorld(); state='menu'; statusEl.textContent='Press Space to start';
requestAnimationFrame(loop);
</script>
</body>
</html>
