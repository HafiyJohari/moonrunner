<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>MKHKASG: MoonRunner</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{ --bg:#000; --fg:#fff; --ui:#111; --uiAlpha:.9; --padZ:9999; }
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
  font-family:ui-monospace,Menlo,Consolas,monospace; image-rendering:pixelated; image-rendering:crisp-edges; -webkit-font-smoothing:none;}
.wrapper{min-height:100dvh;display:flex;flex-direction:column;align-items:center;gap:.75rem;padding:.75rem .5rem 5rem;}
.toolbar{display:flex;gap:.5rem;align-items:center;justify-content:center;border:1px solid var(--fg);padding:.35rem .5rem;
  font-size:12px;position:sticky;top:.5rem;z-index:5;background:var(--ui);opacity:var(--uiAlpha)}
.toolbar button,.toolbar .group{border:1px solid var(--fg);background:transparent;color:var(--fg)}
.toolbar button{padding:.3rem .6rem;cursor:pointer}
.toolbar .group{display:inline-flex;gap:.4rem;align-items:center;padding:.3rem .5rem}
.toolbar .value{min-width:36px;text-align:right;font-variant-numeric:tabular-nums}

.stage{position:relative}
#game{display:block;width:min(96vw,calc(96vh*(16/9)));height:calc(min(96vw,calc(96vh*(16/9)))*(9/16));outline:1px solid var(--fg)}
.hud{position:absolute;left:8px;top:8px;font-size:12px;user-select:none;pointer-events:none}
.overlayCenter{position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none;padding:1rem}
.smallNote{font-size:12px;margin-top:.5rem;opacity:.95}
.titleBlock{font-family:"Press Start 2P",system-ui,sans-serif;line-height:1.5}
.titleMain{font-size:clamp(16px,3vw,32px)}
.subtitle{font-size:clamp(10px,1.6vw,14px);margin-top:.75rem}

/* Leaderboard panel */
.leadWrap{pointer-events:auto; background:rgba(0,0,0,.8); border:1px solid var(--fg); padding:12px 16px; max-width:520px}
.leadWrap h3{margin:0 0 8px 0; font-family:"Press Start 2P",monospace; font-size:16px}
.leadWrap ol{margin:.25rem 0; padding-left:1.25rem; line-height:1.8}
.leadWrap .row{display:flex; justify-content:space-between; gap:10px}
.leadWrap .row span{font-variant-numeric:tabular-nums}

/* Mobile pads */
.pads{position:fixed;inset:auto 0 0 0;display:grid;grid-template-columns:1fr 1fr;gap:.5rem;padding:.75rem;z-index:var(--padZ)}
.padLeft,.padRight{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.padJump{display:grid;grid-template-columns:1fr;gap:.5rem}
.padBtn{background:#111;border:2px solid var(--fg);color:var(--fg);font-size:clamp(14px,4vw,18px);padding:1.1rem 0;touch-action:none;user-select:none}
.pads .ghost{opacity:.75}

/* Desktop vs Mobile */
@media (pointer:coarse),(max-width:920px){ .toolbar{display:none}.pads{display:grid} }
@media (pointer:fine) and (min-width:921px){ .pads{display:none} }

/* Contrast invert */
.invert{filter:invert(1)}
</style>
</head>
<body>
<div class="wrapper" id="root">
  <!-- ===== Desktop toolbar ===== -->
  <div class="toolbar" id="toolbar">
    <button id="btnSound" title="Toggle Sound (M)">🔊 Sound</button>
    <button id="btnContrast" title="Invert (Contrast)">◐ Contrast</button>
    <button id="btnFullscreen" title="Fullscreen (F)">⤢ Fullscreen</button>
    <div class="group" title="Base Speed ±5%">
      <span>Speed</span>
      <button id="speedMinus">−</button>
      <span class="value" id="speedVal">100%</span>
      <button id="speedPlus">+</button>
    </div>
    <button id="btnBoard" title="Leaderboard (L)">🏆 Board</button>
  </div>

  <!-- ===== Stage ===== -->
  <div class="stage">
    <canvas id="game" width="960" height="540"></canvas>
    <div class="hud" id="hud">SCORE 00000  BEST 00000  COINS 000  TIME 00:00</div>
    <div class="overlayCenter" id="centerOverlay">
      <div class="titleBlock" id="titleBlock">
        <div class="titleMain">MKHKASG: MOONRUNNER</div>
        <div class="smallNote subtitle">Press SPACE to start • ←/→ move • W/↑/Space jump • Esc pause • L leaderboard</div>
        <div class="smallNote">Goal: survive. Coins +100. Shield = 1 hit. Slow-mo = 3s.</div>
      </div>
    </div>
    <!-- Leaderboard overlay (hidden by default) -->
    <div class="overlayCenter" id="lbOverlay" style="display:none">
      <div class="leadWrap" id="lbPanel"></div>
    </div>
  </div>

  <!-- ===== Mobile pads ===== -->
  <div class="pads" id="pads">
    <div class="padLeft">
      <button class="padBtn ghost" id="btnLeft">◀</button>
      <button class="padBtn ghost" id="btnRight">▶</button>
    </div>
    <div class="padJump">
      <button class="padBtn" id="btnJump">⤒ JUMP</button>
    </div>
  </div>
</div>

<script>
/* ===========================================================
   ======================== SOUNDS ===========================
   =========================================================== */
const AudioSys=(()=>{let ctx=null,en=true,master=null;
function ensure(){if(!ctx){ctx=new (window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.gain.value=.06;master.connect(ctx.destination)} if(ctx.state==='suspended')ctx.resume()}
function tone(type,f=440,d=.08,v=.25){if(!en)return;ensure();const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(master);const t=ctx.currentTime;o.start(t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.stop(t+d+.02)}
function beep(kind='jump'){ if(!en) return; ensure(); const t=ctx.currentTime, o=ctx.createOscillator(), g=ctx.createGain(); o.type='square'; const tbl={jump:[520,380,.09,.25], coin:[760,520,.07,.28], hit:[160,110,.14,.28], pow:[360,540,.10,.22]}; const [f1,f2,dur,vol]=tbl[kind]||tbl.jump; o.frequency.setValueAtTime(f1,t); o.frequency.exponentialRampToValueAtTime(f2,t+dur); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur); o.connect(g); g.connect(master); o.start(); o.stop(t+dur+.02); }
return {tone,beep,toggle(){en=!en;return en},enabled(){return en}})();

/* ===========================================================
   ======================== SPRITES ==========================
   =========================================================== */
const W=960,H=540;
const VIS_SCALE = matchMedia('(pointer:coarse)').matches ? 1.3 : 1.18; // bigger on mobile

function drawAstronaut(c,x,y,frame){
  c.save(); c.translate(x- (VIS_SCALE-1)*8, y- (VIS_SCALE-1)*11); c.scale(VIS_SCALE,VIS_SCALE);
  c.fillStyle="#fff"; // body
  c.fillRect(2,8,12,12);
  c.fillRect(3,2,10,1); c.fillRect(2,3,12,1); c.fillRect(1,4,14,1);
  c.fillRect(1,5,14,1); c.fillRect(1,6,14,1); c.fillRect(2,7,12,1); c.fillRect(3,8,10,1);
  // backpack
  c.fillRect(0,10,2,8);
  // visor
  c.fillStyle="#000"; c.fillRect(5,4,6,5);
  c.fillStyle="#fff";
  if(frame==="run1"){c.fillRect(3,20,4,2);c.fillRect(9,19,4,3);c.fillRect(0,11,3,2);c.fillRect(13,11,3,2)}
  else if(frame==="run2"){c.fillRect(3,19,4,3);c.fillRect(9,20,4,2);c.fillRect(0,12,3,2);c.fillRect(13,10,3,2)}
  else if(frame==="jump"){c.fillRect(3,19,4,2);c.fillRect(9,19,4,2);c.fillRect(0,10,3,2);c.fillRect(13,10,3,2)}
  else {c.fillRect(6,20,4,2);c.fillRect(0,11,3,2);c.fillRect(13,11,3,2)}
  c.restore();
}
function drawAlien(c,x,y,wob){c.save();c.translate(x,y);c.fillStyle="#fff";
  const rows=[4,6,8,10,8,6,4];let ox=wob?1:0,yy=2;
  rows.forEach(w=>{c.fillRect((11-Math.floor(w/2))+ox,yy,w,1);yy++});
  c.fillStyle="#000"; c.fillRect(8+ox,5,2,1); c.fillRect(12+ox,5,2,1);
  c.fillStyle="#fff"; c.fillRect(7+ox,12,2,2); c.fillRect(13+ox,12,2,2);
  c.restore();
}
function drawUFO(c,x,y,beam=true){
  c.save();c.translate(x,y);c.fillStyle="#fff";
  c.fillRect(12,0,32,2);c.fillRect(8,2,40,2);c.fillRect(6,4,44,2);c.fillRect(4,6,48,2);
  c.fillRect(24,-2,8,2); c.fillRect(0,8,56,2); c.fillRect(6,10,44,2); c.fillRect(10,12,36,2);
  if(beam){c.fillRect(26,14,4,2);c.fillRect(22,16,12,2);c.fillRect(20,18,16,2)}
  c.restore();
}
function drawCoin(c,x,y){c.fillStyle="#fff";c.fillRect(x,y,10,10);c.fillStyle="#000";c.fillRect(x+3,y+3,4,4)}
function drawShield(c,x,y){c.fillStyle="#fff";c.fillRect(x+1,y,10,1);c.fillRect(x,y+1,1,10);c.fillRect(x+11,y+1,1,10);c.fillRect(x+1,y+11,10,1)}
function drawSlow(c,x,y){c.fillStyle="#fff";c.fillRect(x,y+5,12,2)}
function drawGroundSegment(c,x,topY,w){
  c.fillStyle="#fff"; c.fillRect(x,topY,w,2);
  for(let yy=topY+2; yy<H; yy++){
    for(let xx=x; xx<x+w; xx++){
      if(((xx>>1)+(yy>>1))%2===0) c.fillRect(xx,yy,1,1);
    }
  }
}

/* ===========================================================
   ======================== WORLD GEN ========================
   =========================================================== */
const RNG=(()=>{let s=1337;function r(){s^=s<<13;s^=s>>>17;s^=s<<5;return (s>>>0)/4294967295}function seed(v){s=v>>>0}return{rand:r,seed}})();

const world={
  scroll:2.6, speedFactor:1.0, time:0, elapsed:0,
  segments:[], entities:[], items:[],
  starsA:[], starsB:[], lastX:0, floorY:Math.floor(H*0.78),
  tutorialSecs:8, slowMoUntil:0
};
function initStars(){
  world.starsA=[];world.starsB=[];
  const total=Math.floor(60+RNG.rand()*60);
  for(let i=0;i<total;i++){
    const s={x:RNG.rand()*W,y:RNG.rand()*Math.floor(H*0.7)};
    (i%2===0?world.starsA:world.starsB).push(s);
  }
}
function resetWorld(seed=Date.now()){
  RNG.seed(seed); world.scroll=2.6; world.speedFactor=1.0; world.time=0; world.elapsed=0;
  world.segments=[]; world.entities=[]; world.items=[]; world.lastX=0; initStars();
  // Safe runway: small gaps, no aliens
  let x=0; while(x<W*2){
    const segW=Math.floor(220+RNG.rand()*140);
    world.segments.push({x, w:segW, type:'ground', yTop:world.floorY});
    x+=segW;
    const gap=Math.floor(18+RNG.rand()*18);
    world.segments.push({x, w:gap, type:'gap'});
    x+=gap;
  }
  world.lastX=x;
}
function lastEnd(){ const s=world.segments.at(-1); return s? s.x+s.w : 0 }
function diffProfile(){
  const t=Math.min(1, (world.elapsed/22) ); // ~22s to max
  const slow = (performance.now()<world.slowMoUntil)?0.6:1;
  const worldScroll=(2.6 + t*0.9) * slow;     // 2.6 -> 3.5
  const gapMin=24;
  const gapMax=Math.min(84, 36+Math.floor(t*48));
  const groundMin=(world.elapsed<10? 280 : 200 - Math.floor(t*30));
  const groundMax=groundMin+140;
  return {t,worldScroll,gapMin,gapMax,groundMin,groundMax};
}
function spawnAhead(targetX){
  let prevBig=false;
  while(lastEnd()<targetX){
    const afterTutorial = world.elapsed>=world.tutorialSecs;
    const {t,worldScroll,gapMin,gapMax,groundMin,groundMax}=diffProfile();
    world.scroll=worldScroll;

    // ---- Ground ----
    let segW=Math.floor(groundMin + RNG.rand()*(groundMax-groundMin));
    const gx=lastEnd();
    world.segments.push({x:gx,w:segW,type:'ground',yTop:world.floorY});

    // ---- Entities & Items ----
    if(afterTutorial){
      // Alien patrol (kept fair)
      if(RNG.rand()<0.35 && segW>160){
        const safe=64;
        const ax=gx+safe+Math.floor(RNG.rand()*(segW-safe*2));
        world.entities.push({kind:'alien',x:ax,y:world.floorY-14,w:22,h:14,dir:(RNG.rand()<0.5?-1:1),minX:ax-32,maxX:ax+32,t:0});
      }
      // Low ceiling bar
      if(RNG.rand()<0.15 && segW>160){
        const cx=gx+50+Math.floor(RNG.rand()*(segW-100));
        world.entities.push({kind:'spike',x:cx,y:world.floorY-60,w:40,h:10});
      }
    }
    // Coins
    if(RNG.rand()<0.75){
      const ix=gx+30+Math.floor(RNG.rand()*Math.max(60,segW-60));
      world.items.push({kind:'coin',x:ix,y:world.floorY-40,w:10,h:10});
    }
    // Powerups (rare)
    if(afterTutorial && RNG.rand()<0.08){
      const ix=gx+segW-60;
      world.items.push({kind:(RNG.rand()<0.5?'shield':'slow'),x:ix,y:world.floorY-48,w:12,h:12});
    }

    // ---- Gap (fairness rails) ----
    let g= afterTutorial ? Math.floor(gapMin + RNG.rand()*(gapMax-gapMin))
                         : Math.floor(18 + RNG.rand()*18);
    const nearMax = g > gapMax-6;
    if(prevBig && nearMax) g=Math.floor((gapMin+gapMax)/2); // no double-max
    world.segments.push({x:lastEnd(), w:g, type:'gap'});

    // Wide landing after big gap
    prevBig = (afterTutorial && g>=gapMax-4);
    if(prevBig){
      const nx=lastEnd();
      const wideW=Math.max(220, Math.floor(groundMin+60));
      world.segments.push({x:nx,w:wideW,type:'ground',yTop:world.floorY});
      world.items.push({kind:'coin',x:nx+40,y:world.floorY-40,w:10,h:10});
    }
  }
}

/* ===========================================================
   ========================== INPUT ==========================
   =========================================================== */
const input={left:false,right:false,jump:false,lastJumpAt:-1};
addEventListener('keydown',e=>{
  if(e.repeat)return;
  switch(e.code){
    case'ArrowLeft':case'KeyA':input.left=true;break;
    case'ArrowRight':case'KeyD':input.right=true;break;
    case'ArrowUp':case'KeyW':case'Space':input.jump=true;input.lastJumpAt=performance.now();e.preventDefault();break;
    case'Escape': if(game.state==='play') setPaused(true); else if(game.state==='pause') setPaused(false); break;
    case'KeyM':toggleSound();break; case'KeyF':toggleFullscreen();break;
    case'KeyL':toggleLeaderboard();break;
  }
});
addEventListener('keyup',e=>{
  switch(e.code){
    case'ArrowLeft':case'KeyA':input.left=false;break;
    case'ArrowRight':case'KeyD':input.right=false;break;
    case'ArrowUp':case'KeyW':case'Space':input.jump=false;break;
  }
});
function bindPad(btn,on,off){
  const start=e=>{e.preventDefault();on()};
  const end=e=>{e.preventDefault();off()};
  btn.addEventListener('pointerdown',start);
  btn.addEventListener('pointerup',end);
  btn.addEventListener('pointerleave',end);
  btn.addEventListener('pointercancel',end);
  btn.addEventListener('touchstart',start,{passive:false});
  btn.addEventListener('touchend',end);
}
bindPad(document.getElementById('btnLeft'), ()=>input.left=true, ()=>input.left=false);
bindPad(document.getElementById('btnRight'), ()=>input.right=true, ()=>input.right=false);
bindPad(document.getElementById('btnJump'), ()=>{
  input.jump=true; input.lastJumpAt=performance.now(); setTimeout(()=>input.jump=false,180);
}, ()=> input.jump=false);

/* ===========================================================
   =================== PHYSICS & PLAYER ======================
   =========================================================== */
const physics={g:0.65,jumpV:11.5,friction:0.86,coyoteMs:120,bufferMs:120};
const player={x:Math.floor(W*0.25),y:0,w:16,h:22,vx:0,vy:0,onGround:false,lastGroundAt:0,shield:false,score:0,coins:0,best:0};
function groundYAt(x){
  for(const s of world.segments){ if(s.type==='ground' && x>=s.x && x<=s.x+s.w) return world.floorY; }
  return null;
}
function overlap(a,b){return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y}

/* ===========================================================
   ======================== DRAW / HUD =======================
   =========================================================== */
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d',{alpha:false,desynchronized:true});
ctx.imageSmoothingEnabled=false;
const hud=document.getElementById('hud');
const centerOverlay=document.getElementById('centerOverlay');
const lbOverlay=document.getElementById('lbOverlay');
const lbPanel=document.getElementById('lbPanel');

const game={state:'title',lastTime:0,dpr:1};
function applyDPR(){
  const dpr=Math.min(2,window.devicePixelRatio||1);
  if(dpr!==game.dpr){game.dpr=dpr;canvas.width=W*dpr;canvas.height=H*dpr;}
  ctx.setTransform(game.dpr,0,0,game.dpr,0,0);
  ctx.imageSmoothingEnabled=false;
}
applyDPR(); addEventListener('resize',applyDPR);

let titleBeamOn=true,titleT=0;
function drawTitle(){
  ctx.fillStyle="#000";ctx.fillRect(0,0,W,H);
  for(const s of world.starsA) ctx.fillStyle="#fff",ctx.fillRect(s.x|0,s.y|0,1,1);
  for(const s of world.starsB) ctx.fillStyle="#fff",ctx.fillRect(s.x|0,s.y|0,1,1);
  const ufx=(W>>1)-28, ufy=Math.floor(H*0.28);
  drawUFO(ctx,ufx,ufy,titleBeamOn);
  drawAstronaut(ctx,(W>>1)-8,ufy+32,"idle");
}
function render(){
  ctx.fillStyle="#000";ctx.fillRect(0,0,W,H);
  ctx.fillStyle="#fff";
  for(const s of world.starsA) ctx.fillRect(s.x|0,s.y|0,1,1);
  for(const s of world.starsB) ctx.fillRect(s.x|0,s.y|0,1,1);
  for(const seg of world.segments) if(seg.type==='ground') drawGroundSegment(ctx,seg.x|0,world.floorY,seg.w|0);
  for(const it of world.items){
    if(it.kind==='coin') drawCoin(ctx,it.x|0,it.y|0);
    else if(it.kind==='shield') drawShield(ctx,it.x|0,it.y|0);
    else drawSlow(ctx,it.x|0,it.y|0);
  }
  const wob = ((world.time*8)|0)%2===0;
  for(const en of world.entities) if(en.kind==='alien') drawAlien(ctx,en.x|0,en.y|0,wob);
  // player
  const frame = !player.onGround ? "jump" : (Math.abs(player.vx)>0.5 ? (((world.time*12)|0)%2?"run1":"run2") : "idle");
  drawAstronaut(ctx,player.x|0,player.y|0,frame);
  // slow-mo indicator
  if(performance.now()<world.slowMoUntil){ for(let i=0;i<W;i+=8) ctx.fillRect(i,0,4,2); }
}
function fmtTime(sec){ const s=Math.max(0,Math.floor(sec)); const m=(s/60)|0, r=s%60; return `${String(m).padStart(2,'0')}:${String(r).padStart(2,'0')}`; }
function updateHUD(){
  const sc=player.score|0, be=player.best|0;
  const t=fmtTime(world.elapsed);
  const coins = String(player.coins).padStart(3,'0');
  hud.textContent=`SCORE ${String(sc).padStart(5,'0')}  BEST ${String(be).padStart(5,'0')}  COINS ${coins}  TIME ${t}`;
}

/* ===========================================================
   ========================= LOOP ============================
   =========================================================== */
function setPaused(p){
  if(p){ game.state='pause'; centerOverlay.style.display='grid'; centerOverlay.innerHTML=`<div class="titleBlock"><div class="titleMain">PAUSED</div><div class="smallNote">Esc to resume</div></div>`; }
  else { game.state='play'; centerOverlay.style.display='none'; }
}
function setGameOver(){
  game.state='over';
  // Save score & leaderboard
  const finalScore=Math.floor(player.score);
  const entry={name: (localStorage.getItem('moon_name')||'YOU'),
               score: finalScore, coins: player.coins|0, time: Math.floor(world.elapsed), at: Date.now()};
  saveLeaderboard(entry);
  // Overlay
  centerOverlay.style.display='grid';
  centerOverlay.innerHTML=`<div class="titleBlock">
    <div class="titleMain">GAME OVER</div>
    <div class="smallNote">Score ${finalScore} • Coins ${entry.coins} • Time ${fmtTime(entry.time)}</div>
    <div class="smallNote">Space/Enter to retry • L to view leaderboard</div>
  </div>`;
}
function startGame(){
  player.best = Number(localStorage.getItem('moon_best')||0) || 0;
  Object.assign(player,{x:Math.floor(W*0.25),y:0,vx:0,vy:0,onGround:false,lastGroundAt:0,shield:false,score:0,coins:0});
  resetWorld();
  game.state='play'; centerOverlay.style.display='none'; lbOverlay.style.display='none';
  AudioSys.beep('coin');
}
addEventListener('keydown',e=>{
  if((e.code==='Space'||e.code==='Enter') && (game.state==='title'||game.state==='over')) startGame();
});
function playerHit(){
  AudioSys.beep('hit');
  const sc=Math.floor(player.score);
  if(sc>player.best){ player.best=sc; localStorage.setItem('moon_best',String(sc)); }
  setGameOver();
}
function step(ts){
  if(!game.lastTime) game.lastTime=ts;
  const rawDt=Math.min(50, ts-game.lastTime); game.lastTime=ts;
  let timeScale=world.speedFactor; if(performance.now()<world.slowMoUntil) timeScale*=0.6;
  const dt=rawDt*(timeScale/16.6667);

  if(game.state==='title'){
    titleT+=dt; if(titleT>6){titleT=0;titleBeamOn=!titleBeamOn}
    drawTitle(); updateHUD(); requestAnimationFrame(step); return;
  }
  if(game.state==='pause'){ render(); updateHUD(); requestAnimationFrame(step); return; }

  // ===== World time & parallax =====
  world.time+=dt; world.elapsed+=dt/60;
  const sA=world.scroll*0.3*dt, sB=world.scroll*0.6*dt, sG=world.scroll*dt;
  for(const s of world.starsA){ s.x-=sA; if(s.x<0) s.x+=W; }
  for(const s of world.starsB){ s.x-=sB; if(s.x<0) s.x+=W; }

  spawnAhead(W+600);

  // Scroll world left
  for(const seg of world.segments) seg.x-=sG;
  for(const it of world.items) it.x-=sG;
  for(const en of world.entities){
    en.x-=sG;
    if(en.kind==='alien'){
      en.t+=dt; if(en.t>0.5){en.t=0; if(Math.random()<0.2) en.dir*=-1}
      en.x += en.dir * 0.8 * dt;
    }
  }
  // Clean up
  world.segments = world.segments.filter(s=>s.x+s.w>-220);
  world.items    = world.items.filter(i=>i.x+i.w>-80);
  world.entities = world.entities.filter(e=>e.x+(e.w||40)>-120);

  // ===== Player physics =====
  if(input.left && !input.right) player.vx = Math.max(-4.0, player.vx - 0.6*dt);
  else if(input.right && !input.left) player.vx = Math.min(4.0, player.vx + 0.6*dt);
  else player.vx *= Math.pow(physics.friction, dt);

  player.vy += physics.g * dt;

  const feetX = player.x + player.w/2;
  const gTop  = groundYAt(feetX);
  let onNow=false;
  if(gTop!==null){
    const feet=player.y+player.h;
    if(feet>=gTop && player.vy>=0){ player.y=gTop-player.h; player.vy=0; onNow=true; }
  }
  if(onNow) player.lastGroundAt=performance.now();
  player.onGround=onNow;

  const now=performance.now();
  const canCoyote=(now - player.lastGroundAt) <= physics.coyoteMs;
  const buffered=(now - input.lastJumpAt) <= physics.bufferMs;
  if((input.jump||buffered) && (player.onGround||canCoyote)){
    player.vy = -physics.jumpV; input.lastJumpAt=-1; AudioSys.beep('jump');
  }

  player.x += player.vx * dt;
  player.y += player.vy * dt;

  if(player.y > H+40){ if(player.shield){ player.shield=false; player.y=world.floorY-player.h-2; player.vy=-physics.jumpV*0.9; AudioSys.beep('hit'); } else playerHit(); }

  // Items
  const p={x:player.x,y:player.y,w:player.w,h:player.h};
  for(let i=world.items.length-1;i>=0;i--){
    const it=world.items[i];
    if(overlap(p,it)){
      if(it.kind==='coin'){ player.score+=100; player.coins++; AudioSys.beep('coin'); }
      else if(it.kind==='shield'){ player.shield=true; AudioSys.beep('pow'); }
      else { world.slowMoUntil=performance.now()+3000; AudioSys.beep('pow'); }
      world.items.splice(i,1);
    }
  }
  // Aliens / spikes
  for(const en of world.entities){
    if(en.kind==='alien' && overlap(p,en)){
      if(player.shield){ player.shield=false; player.vy=-6; player.vx*=-0.5; AudioSys.beep('hit'); }
      else { playerHit(); break; }
    }
    if(en.kind==='spike'){
      const box={x:en.x,y:en.y,w:en.w,h:en.h};
      if(overlap(p,box)){ if(player.shield){ player.shield=false; player.vy=-6; AudioSys.beep('hit'); } else { playerHit(); break; } }
    }
  }

  // Score: time/distance
  player.score += (0.8 + world.scroll*0.1) * dt;

  // Render & HUD
  render(); updateHUD();

  requestAnimationFrame(step);
}

/* Boot */
(function boot(){
  const best=Number(localStorage.getItem('moon_best')||0); player.best=isFinite(best)?best:0;
  resetWorld(); drawTitle(); updateHUD(); requestAnimationFrame(step);
})();

   ====================== UI / TOOLBAR =======================

const root=document.getElementById('root');
const btnSound=document.getElementById('btnSound');
const btnContrast=document.getElementById('btnContrast');
const btnFullscreen=document.getElementById('btnFullscreen');
const btnBoard=document.getElementById('btnBoard');
const speedMinus=document.getElementById('speedMinus');
const speedPlus=document.getElementById('speedPlus');
const speedVal=document.getElementById('speedVal');
function updateSpeedLabel(){ speedVal.textContent=`${Math.round(world.speedFactor*100)}%`; }
function toggleSound(){ const on=AudioSys.toggle(); btnSound.textContent=(on?'🔊 Sound':'🔇 Sound'); }
function toggleContrast(){ root.classList.toggle('invert'); }
async function toggleFullscreen(){ const el=document.documentElement; if(!document.fullscreenElement) await el.requestFullscreen().catch(()=>{}); else await document.exitFullscreen().catch(()=>{}); }
btnSound.addEventListener('click',toggleSound);
btnContrast.addEventListener('click',toggleContrast);
btnFullscreen.addEventListener('click',toggleFullscreen);
speedMinus.addEventListener('click',()=>{ world.speedFactor=Math.max(0.5, Math.round((world.speedFactor-0.05)*100)/100); updateSpeedLabel(); });
speedPlus.addEventListener('click',()=>{ world.speedFactor=Math.min(1.5, Math.round((world.speedFactor+0.05)*100)/100); updateSpeedLabel(); });
btnBoard.addEventListener('click',()=>toggleLeaderboard());
updateSpeedLabel();

const canvasEl=document.getElementById('game');
canvasEl.addEventListener('pointerdown',()=>{ if(game.state==='title'||game.state==='over') startGame(); });
document.getElementById('pads').addEventListener('touchmove',e=>e.preventDefault(),{passive:false});

/* ===========================================================
   ========================= LEADERBOARD =====================
   =========================================================== */
function getLB(){ try{ return JSON.parse(localStorage.getItem('moon_lb')||'[]'); }catch{ return [] } }
function saveLB(arr){ localStorage.setItem('moon_lb', JSON.stringify(arr.slice(0,10))); }
function saveLeaderboard(entry){
  const arr=getLB(); arr.push(entry);
  arr.sort((a,b)=> b.score-a.score || b.coins-a.coins || b.time-a.time);
  saveLB(arr);
}
function renderLB(){
  const arr=getLB();
  const name = localStorage.getItem('moon_name') || 'YOU';
  let html=`<h3>🏆 Leaderboard</h3>
  <div class="row" style="margin-bottom:6px">
    <span>Player: <strong>${name}</strong></span>
    <button style="background:transparent;border:1px solid currentColor;color:inherit;cursor:pointer" id="setName">Set Name</button>
  </div>
  <ol>`;
  if(arr.length===0) html+=`<li><span>No scores yet — go run!</span></li>`;
  arr.slice(0,10).forEach((e,i)=>{
    html+=`<li class="row"><span>${e.name}</span><span>Score ${e.score.toString().padStart(5,'0')} • Coins ${e.coins.toString().padStart(3,'0')} • ${fmtTime(e.time)}</span></li>`;
  });
  html+=`</ol>
  <div class="row" style="margin-top:8px"><button id="closeLB" style="background:transparent;border:1px solid currentColor;color:inherit;cursor:pointer">Close (L)</button>
  <button id="clearLB" style="background:transparent;border:1px solid currentColor;color:inherit;cursor:pointer">Clear</button></div>`;
  lbPanel.innerHTML=html;
  lbPanel.querySelector('#closeLB').onclick=()=>toggleLeaderboard(false);
  lbPanel.querySelector('#clearLB').onclick=()=>{ localStorage.removeItem('moon_lb'); renderLB(); };
  lbPanel.querySelector('#setName').onclick=()=>{
    const v=prompt('Enter your name/initials (max 12):', localStorage.getItem('moon_name')||'YOU')||'YOU';
    localStorage.setItem('moon_name', v.slice(0,12));
    renderLB();
  };
}
function toggleLeaderboard(force){
  const want = (typeof force==='boolean') ? force : (lbOverlay.style.display==='none');
  if(want){ renderLB(); lbOverlay.style.display='grid'; }
  else { lbOverlay.style.display='none'; }
}
