<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MkhkAsg: MoonRunner v1.9 — Daily & Skins + Insane</title>
<style>
  :root{--fg:#fff;--bg:#000}
  html,body{margin:0;height:100%;background:#000;color:#fff;font-family:system-ui,Segoe UI,Arial}
  canvas{display:block;margin:0 auto;image-rendering:pixelated;image-rendering:crisp-edges}
  /* Lite 1-bit UI */
  .bar{position:fixed;left:50%;top:8px;transform:translateX(-50%);display:flex;gap:8px;z-index:10}
  .btn{border:2px solid #fff;background:#000;color:#fff;padding:4px 8px;cursor:pointer;font-weight:600}
  .btn:disabled{opacity:.5;cursor:default}
  .hud{position:fixed;left:16px;top:8px;font-weight:700;letter-spacing:1px}
  .hudR{position:fixed;right:16px;top:8px;font-weight:700;text-align:right}
  .modal{position:fixed;inset:0;display:none;place-items:center;background:rgba(0,0,0,.7);z-index:20}
  .panel{background:#000;border:2px solid #fff;padding:14px 16px;min-width:320px;max-width:95vw}
  .title{font-weight:900;margin-bottom:8px}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin:.5rem 0}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .card{display:grid;place-items:center;border:2px solid #fff;background:#000;color:#fff;padding:8px;cursor:pointer}
  .in{border:2px solid #fff;background:#000;color:#fff;padding:6px 8px;min-width:180px}
  .tabs{display:flex;gap:6px;margin:8px 0}
  .mono{font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
  .small{font-size:12px;opacity:.85}
  .foot{margin-top:8px;display:flex;justify-content:flex-end;gap:6px}
</style>
</head>
<body>
<canvas id="game" width="960" height="540"></canvas>

<div class="hud mono" id="hudL">SCORE 00000  BEST 00000</div>
<div class="hudR mono" id="hudR">MODE Normal (×1.5)<br>SHIELDS ●●●</div>

<div class="bar">
  <button class="btn" id="btnSound">🔊 Sound</button>
  <button class="btn" id="btnContrast">⬛/⬜ Contrast</button>
  <button class="btn" id="btnFull">⤢ Fullscreen</button>
  <button class="btn" id="btnChars">Characters</button>
  <button class="btn" id="btnLB">Leaderboard</button>
</div>

<!-- Character Select -->
<div class="modal" id="charModal">
  <div class="panel">
    <div class="title">Character Select</div>
    <div class="grid3">
      <button class="card" data-skin="astro">
        <canvas class="skinPrev" width="64" height="64"></canvas>
        <div>Astronaut</div>
      </button>
      <button class="card" data-skin="invert">
        <canvas class="skinPrev" width="64" height="64"></canvas>
        <div>Astro (Invert)</div>
      </button>
      <button class="card" data-skin="alien">
        <canvas class="skinPrev" width="64" height="64"></canvas>
        <div>Alien</div>
      </button>
    </div>
    <div class="foot">
      <button class="btn" id="charClose">Close</button>
    </div>
  </div>
</div>

<!-- Leaderboard -->
<div class="modal" id="lbModal">
  <div class="panel" style="min-width:560px;">
    <div class="title">Leaderboard <span class="small mono" id="lbSub"></span></div>
    <div class="tabs">
      <button class="btn" data-tab="daily">Today</button>
      <button class="btn" data-tab="all">All-time</button>
      <button class="btn" data-tab="top20">Top 20</button>
      <button class="btn" data-tab="top10">Top 10</button>
    </div>
    <div class="mono small" id="lbNameRow">Your name: <input id="nameInput" class="in mono" maxlength="12" autocomplete="off" spellcheck="false"></div>
    <div class="mono" id="lbTable" style="margin-top:8px;white-space:pre;"></div>
    <div class="foot">
      <button class="btn" id="lbBack">Back</button>
    </div>
  </div>
</div>

<script>
/* ====== CONFIG ====== */
const LEADERBOARD_URL = "https://script.google.com/macros/s/AKfycbyK7Wb7yYxaxbPBf78WcOWB9ywsAcc1-od5FIXp3WiujwzbI1sx4eu7WR43el72NaFI4g/exec"; // <— replace
const GAME_VERSION = "v1.9";
const NAME_RE = /[^A-Za-z0-9 _\-.]/g;
const NAME_KEY = "moonrunner_name";
const SKIN_KEY = "moonrunner_skin";
const MODES = [
  {key:'Casual', speed:1.2, mult:1.2},
  {key:'Normal', speed:1.5, mult:1.5},
  {key:'Hard',   speed:1.9, mult:1.8},
  {key:'Insane', speed:2.4, mult:2.3}
];
let modeIndex = 1; // default Normal

/* ====== CANVAS & TIME ====== */
const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d');
let W = cvs.width, H = cvs.height;

// Resize keeping 16:9 letterbox
function fit() {
  const ww = innerWidth, hh = innerHeight;
  const target = 16/9, cur = ww/hh;
  let sw, sh;
  if (cur>target){ sh=hh; sw=sh*target; }
  else { sw=ww; sh=sw/target; }
  cvs.style.width = sw+"px"; cvs.style.height = sh+"px";
}
addEventListener('resize', fit); fit();

let last=performance.now(), acc=0;
const FIX = 1000/60;

/* ====== STATE ====== */
let playing=false, paused=false;
let score=0, best=Number(localStorage.getItem('mr_best')||0);
let mult = MODES[modeIndex].mult;
let baseRun = MODES[modeIndex].speed;
let speed = baseRun;          // world scroll px per 16ms tick baseline unit
let speedCap = baseRun*3.2;   // ramp cap
let ramp = 0;                 // grows with time
let shields = 3;
let invul=0;                  // seconds
let slow=0;                   // seconds
let name = (localStorage.getItem(NAME_KEY)||"MkhkAsg").slice(0,12).replace(NAME_RE,'');
let skin = localStorage.getItem(SKIN_KEY)||'astro';

const stars = [...Array(120)].map(()=>({x:Math.random()*W,y:Math.random()*H}));
let ground = []; // segments {x,w,type: 'block' | 'gap' | 'haz_spike' | 'haz_alien' }
let items  = []; // {x,y,t:'chip'|'shield'|'slow'}
let player = {x:140,y:0,vy:0,on:false};

/* ====== INPUT ====== */
const keys = {};
addEventListener('keydown', e=>{ keys[e.code]=true; if(e.code==='Space') e.preventDefault(); });
addEventListener('keyup', e=> keys[e.code]=false);

/* ====== SOUND (simple) ====== */
let soundOn = true;
const actx = new (window.AudioContext||window.webkitAudioContext)();
function beep(freq=440,ms=60){
  if(!soundOn) return;
  const o=actx.createOscillator(), g=actx.createGain();
  o.type='square'; o.frequency.value=freq; o.connect(g); g.connect(actx.destination);
  g.gain.setValueAtTime(.05, actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime+ms/1000);
  o.start(); o.stop(actx.currentTime+ms/1000);
}

/* ====== UI HOOKS ====== */
const hudL = document.getElementById('hudL');
const hudR = document.getElementById('hudR');
document.getElementById('btnSound').onclick=()=>{
  soundOn=!soundOn; document.getElementById('btnSound').textContent = soundOn?'🔊 Sound':'🔈 Muted';
}
document.getElementById('btnContrast').onclick=()=>{
  document.body.style.filter = document.body.style.filter ? '' : 'invert(1)';
}
document.getElementById('btnFull').onclick=()=>{ if(document.fullscreenElement) document.exitFullscreen(); else cvs.requestFullscreen(); };
document.getElementById('btnChars').onclick=()=> openChars();
document.getElementById('btnLB').onclick=()=> openLB();

/* ====== CHAR SELECT ====== */
const charModal = document.getElementById('charModal');
document.getElementById('charClose').onclick=()=> charModal.style.display='none';
document.querySelectorAll('#charModal .card').forEach((b,i)=>{
  b.addEventListener('click',()=>{
    const s=b.dataset.skin; skin=s; localStorage.setItem(SKIN_KEY,s);
    charModal.style.display='none';
  });
});
function openChars(){ charModal.style.display='grid'; }
function drawPreview(cv, kind){
  const c=cv.getContext('2d'), w=cv.width, h=cv.height;
  c.imageSmoothingEnabled=false;
  c.clearRect(0,0,w,h); c.fillStyle='#000'; c.fillRect(0,0,w,h); c.fillStyle='#fff'; c.strokeStyle='#fff';
  c.save(); c.translate(w/2, h/2+10);
  if(kind==='alien'){
    c.fillRect(-6,-18,12,10); c.clearRect(-3,-16,2,2); c.clearRect(1,-16,2,2);
    c.fillRect(-5,-8,10,8); c.fillRect(-8,0,6,4); c.fillRect(2,0,6,4);
  }else{
    if(kind==='invert'){ c.fillStyle='#000'; c.fillRect(-8,-22,16,22); c.fillStyle='#fff'; }
    c.strokeRect(-8,-22,16,12); c.fillRect(-4,-18,8,6); c.fillRect(-6,-10,12,8);
    c.fillRect(-8,0,6,4); c.fillRect(2,0,6,4);
  }
  c.restore();
}
document.querySelectorAll('.skinPrev').forEach((cv,i)=>drawPreview(cv,['astro','invert','alien'][i]));

/* ====== LEADERBOARD ====== */
const lbModal = document.getElementById('lbModal');
const lbSub = document.getElementById('lbSub');
const lbTable = document.getElementById('lbTable');
const nameInput = document.getElementById('nameInput');
document.getElementById('lbBack').onclick=()=> lbModal.style.display='none';
nameInput.value = name;
nameInput.addEventListener('input', e=>{
  let s = (e.target.value||'').toString().trim().replace(/\s+/g,' ').replace(NAME_RE,'').slice(0,12);
  if(!s) s='Player';
  e.target.value=s; name=s; localStorage.setItem(NAME_KEY,name);
});
let lbTab='daily'; // default Today
document.querySelectorAll('#lbModal .tabs .btn').forEach(b=>{
  b.onclick=()=>{ lbTab=b.dataset.tab; loadLB(); };
});

async function fetchLB(period='daily',limit=20){
  const url = `${LEADERBOARD_URL}?action=list&period=${encodeURIComponent(period)}&limit=${limit}`;
  const res = await fetch(url,{cache:'no-store'});
  return res.json();
}
async function loadLB(){
  try{
    let period='all', limit=20;
    if(lbTab==='daily'){ period='daily'; limit=20; }
    else if(lbTab==='all'){ period='all'; limit=200; }
    else if(lbTab==='top20'){ period='all'; limit=20; }
    else if(lbTab==='top10'){ period='all'; limit=10; }
    const data = await fetchLB(period, limit);
    lbSub.textContent = (lbTab==='daily')?`Today (${data.tz||''})`:
                        (lbTab==='all')?`All-time`:
                        (lbTab==='top20')?`Top 20`:`Top 10`;
    const rows = data.rows||[];
    if(rows.length===0){ lbTable.textContent = 'No scores yet — be the first!'; return; }
    const head = `  #   SCORE      NAME          MODE     DATE\n`;
    const body = rows.map((r,i)=>{
      const rank = String(i+1).padStart(2,' ');
      const sc = String(r.score).padStart(6,' ');
      const nm = (r.name||'Player').padEnd(12,' ').slice(0,12);
      const md = (r.mode||'-').padEnd(7,' ').slice(0,7);
      return ` ${rank}  ${sc}   ${nm}   ${md}   ${r.date}`;
    }).join('\n');
    lbTable.textContent = head+body;
  }catch(e){
    lbTable.textContent = 'Failed to load. Check URL.';
  }
}
function openLB(){ lbModal.style.display='grid'; loadLB(); }
async function postScore(){
  try{
    await fetch(LEADERBOARD_URL,{
      method:'POST',
      headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:new URLSearchParams({
        name: name, score: Math.floor(score), mode: MODES[modeIndex].key, version: GAME_VERSION
      })
    });
  }catch(e){}
}

/* ====== WORLD GEN ====== */
function resetWorld(){
  score=0; shields=3; invul=0; slow=0; ramp=0;
  speed = MODES[modeIndex].speed;
  mult = MODES[modeIndex].mult;
  ground.length=0; items.length=0;
  player.x=140; player.y=H-92; player.vy=0; player.on=false;
  let x=0;
  // start runway
  for(let i=0;i<18;i++){ ground.push({x:x,w:80,type:'block'}); x+=80; }
  // chunks
  for(let i=0;i<80;i++){ placeChunk(x); x += 240; }
}
function placeChunk(x){
  // choose: gap or block sequence
  const r = Math.random();
  if(r<0.25){ // gap
    ground.push({x:x,w:80,type:'gap'});
  }else{
    const w=200+Math.random()*200;
    ground.push({x:x,w:w,type:'block'});
    // hazards / items on this block
    if(Math.random()<0.38){ // alien
      items.push({x:x+40+Math.random()*(w-80), y:H-110, t:'haz_alien', tick:0});
    }else if(Math.random()<0.19){ // spike
      items.push({x:x+40+Math.random()*(w-80), y:H-92, t:'haz_spike'});
    }
    // collectibles
    if(Math.random()<0.55){ items.push({x:x+30+Math.random()*(w-60), y:H-140, t:'chip'}); }
    if(Math.random()<0.18){ items.push({x:x+60+Math.random()*(w-120), y:H-160, t:'shield', tick:0}); }
    if(Math.random()<0.12){ items.push({x:x+80+Math.random()*(w-160), y:H-150, t:'slow', tick:0}); }
  }
}

/* ====== CALLOUTS ====== */
const calls=[];
function addCall(s,x,y){ calls.push({t:s,x,y,vy:-0.35,a:1}); }
function updCalls(dt){
  for(let i=calls.length-1;i>=0;i--){
    const c=calls[i]; c.y+=c.vy*dt*60; c.a-=dt*0.9; if(c.a<=0) calls.splice(i,1);
  }
}
function drawCalls(){
  ctx.save(); ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.textBaseline='bottom';
  for(const c of calls){ ctx.globalAlpha=c.a; ctx.fillText(c.t,c.x,c.y); }
  ctx.restore(); ctx.globalAlpha=1;
}

/* ====== PHYSICS ====== */
function update(dt){
  // ramp speed over time (cap)
  ramp += dt*0.035; // gentle
  const slowMul = slow>0 ? 0.5 : 1;
  speed = Math.min(speedCap, (MODES[modeIndex].speed + ramp)) * slowMul;

  // stars parallax
  for(const s of stars){ s.x-=speed*0.15*dt*60; if(s.x<0) s.x+=W; }

  // ground scroll
  for(const g of ground){ g.x -= speed*dt*60; }
  // recycle
  while(ground.length && ground[0].x + ground[0].w < -20){ ground.shift(); }
  while(ground.length<90){ const lastX = ground[ground.length-1].x + ground[ground.length-1].w + 160; placeChunk(lastX); }

  // items scroll
  for(const it of items){ it.x -= speed*dt*60; if(it.tick!=null) it.tick+=dt; }
  for(let i=items.length-1;i>=0;i--) if(items[i].x<-40) items.splice(i,1);

  // input move/jump
  const left = keys['ArrowLeft']||keys['KeyA'];
  const right= keys['ArrowRight']||keys['KeyD'];
  const jump = keys['ArrowUp']||keys['KeyW']||keys['Space'];
  if(left) player.x-= 2.6*dt*60;
  if(right)player.x+= 2.6*dt*60;
  // gravity
  player.vy += 0.55*dt*60;
  player.y += player.vy;

  // ground collision
  player.on=false;
  let under=null;
  for(const g of ground){
    if(g.type==='block'){
      if(player.x>g.x-10 && player.x<g.x+g.w+10){
        const gy = H-92;
        if(player.y>=gy-1){ player.y=gy; player.vy=0; player.on=true; under=g; }
      }
    }
  }
  if(jump && player.on){ player.vy=-8.8; beep(880,70); }

  // fall into gap -> damage or death
  if(player.y>H){ takeHit(); }

  // item interactions
  for(let i=items.length-1;i>=0;i--){
    const it=items[i];
    if(it.t==='chip' && Math.abs(player.x-it.x)<16 && Math.abs(player.y-it.y)<26){
      const add = Math.round(200*mult);
      score+=add; addCall(`+${add}`, player.x, player.y-26); items.splice(i,1); beep(1200,60);
      continue;
    }
    if(it.t==='shield' && Math.abs(player.x-it.x)<16 && Math.abs(player.y-it.y)<26){
      if(shields<3){ shields++; addCall('Shield!', player.x, player.y-26); }
      else{ score+=100; addCall('+100', player.x, player.y-26); }
      items.splice(i,1); beep(600,80); continue;
    }
    if(it.t==='slow' && Math.abs(player.x-it.x)<16 && Math.abs(player.y-it.y)<26){
      slow = 3.0; addCall('Slow-mo!', player.x, player.y-26); items.splice(i,1); beep(520,120); continue;
    }
    // hazards
    if((it.t==='haz_spike'||it.t==='haz_alien') && Math.abs(player.x-it.x)<14 && player.y>H-120){
      if(invul<=0){ takeHit(); }
    }
  }

  // timers
  if(invul>0) invul-=dt;
  if(slow>0) slow-=dt;

  // score over distance
  score += speed*0.12*mult*dt*60;

  updCalls(dt);
}

function takeHit(){
  if(shields>0){
    shields--; invul=1.0; addCall('HIT!', player.x, player.y-26); beep(200,120);
  }else{
    gameOver();
  }
}

function gameOver(){
  playing=false;
  if(score>best){ best=Math.floor(score); localStorage.setItem('mr_best',best); }
  postScore();
  lbModal.style.display='grid'; lbTab='daily'; loadLB();
}

/* ====== DRAW ====== */
function draw(){
  ctx.fillStyle = '#000'; ctx.fillRect(0,0,W,H);
  // stars
  ctx.fillStyle='#fff';
  for(const s of stars){ ctx.fillRect(s.x|0, s.y|0, 2,2); }

  // border line horizon
  ctx.fillRect(16,H-92, W-32, 2);

  // ground blocks
  for(const g of ground){
    if(g.type==='block'){
      ctx.fillRect(g.x|0, (H-90)|0, g.w|0, 20);
      // dot texture
      for(let x=(g.x|0); x<g.x+g.w; x+=12){ ctx.fillRect(x+4,H-82,2,2); ctx.fillRect(x+10,H-74,2,2); }
    }
  }

  // items & hazards (with small animations)
  for(const it of items){
    if(it.t==='chip'){
      const bob = Math.sin((performance.now()/180)+it.x*0.05)*2;
      // twinkle
      if(((performance.now()/180)|0)%2===0){ ctx.fillRect(it.x-2, it.y+bob-6, 4,4); }
      ctx.fillRect(it.x-1, it.y+bob-1, 2,2);
    }else if(it.t==='shield'){
      const p = 1+Math.sin((performance.now()/260)+it.x*0.1)*0.3;
      ctx.strokeStyle='#fff'; ctx.lineWidth=1; ctx.strokeRect(it.x-6*p, it.y-10*p, 12*p, 16*p);
    }else if(it.t==='slow'){
      const scan = ((performance.now()/160)%12)|0;
      ctx.strokeStyle='#fff'; ctx.strokeRect(it.x-8,it.y-12,16,24);
      ctx.fillRect(it.x-8, it.y-12+scan, 16, 2);
    }else if(it.t==='haz_spike'){
      ctx.fillRect(it.x-8,H-92-10,16,10);
    }else if(it.t==='haz_alien'){
      ctx.fillRect(it.x-9,H-92-18,18,18);
      if(((performance.now()/300)|0)%2===0){ ctx.clearRect(it.x-3,H-92-14,2,2); ctx.clearRect(it.x+1,H-92-14,2,2); }
    }
  }

  // player
  drawPlayer(ctx, player.x, player.y, shields>0, invul>0);

  // callouts
  drawCalls();

  // HUD
  const m = MODES[modeIndex];
  hudL.textContent = `SCORE ${String(Math.floor(score)).padStart(5,'0')}  BEST ${String(best).padStart(5,'0')}`;
  hudR.innerHTML = `MODE ${m.key} (×${m.mult.toFixed(1)})<br>SHIELDS ${'●'.repeat(shields)}${'○'.repeat(3-shields)}`;
}

function drawPlayer(ctx, px, py, hasShield, invFlash){
  ctx.save(); ctx.translate(px|0, py|0);
  ctx.fillStyle='#fff'; ctx.strokeStyle='#fff';
  if(invFlash) { ctx.globalAlpha = 0.7; }

  if(skin==='alien'){
    ctx.fillRect(-6,-18,12,10); ctx.clearRect(-3,-16,2,2); ctx.clearRect(1,-16,2,2);
    ctx.fillRect(-5,-8,10,8);
  }else{
    if(skin==='invert'){ ctx.fillStyle='#000'; ctx.fillRect(-8,-22,16,22); ctx.fillStyle='#fff'; }
    ctx.strokeRect(-8,-22,16,12);
    ctx.fillRect(-4,-18,8,6);
    ctx.fillRect(-6,-10,12,8);
  }
  ctx.fillRect(-8,0,6,4); ctx.fillRect(2,0,6,4);

  if(hasShield){
    ctx.globalAlpha=1; ctx.strokeRect(-10,-24,20,30);
  }
  ctx.restore(); ctx.globalAlpha=1;
}

/* ====== LOOP ====== */
function tick(now){
  const dtms = now-last; last=now; acc+=dtms;
  while(acc>=FIX){
    const dt = FIX/1000;
    if(playing && !paused) update(dt);
    acc-=FIX;
  }
  draw();
  requestAnimationFrame(tick);
}

/* ====== MENU / START ====== */
addEventListener('keydown', e=>{
  if(e.code==='Enter' || e.code==='Space'){
    if(!playing){ resetWorld(); playing=true; }
  }
});
cvs.addEventListener('pointerdown', ()=>{
  if(!playing){ resetWorld(); playing=true; }
});

/* ====== INIT ====== */
resetWorld();
requestAnimationFrame(tick);

/* ====== UTILS ====== */
function sanitizeName(s){
  s=(s||'').toString().trim().replace(/\s+/g,' ').replace(NAME_RE,'').slice(0,12);
  return s||'Player';
}
localStorage.setItem(NAME_KEY, sanitizeName(name));

</script>
</body>
</html>
