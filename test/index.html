<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MKHKASG: MoonRunner — v1.8.1 “i-Frames Edition”</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root { --w:960; --h:540; }
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:ui-monospace,Consolas,Menlo,monospace}
body.invert{background:#fff;color:#000}
.wrap{display:grid;place-items:center;height:100%;gap:8px;padding:10px}
canvas{width:min(96vw,96vh*(16/9));height:calc(var(--h)*(min(96vw,96vh*(16/9))/var(--w)));
 image-rendering:pixelated;image-rendering:crisp-edges;background:transparent}
.hud{width:min(96vw,96vh*(16/9));display:flex;justify-content:space-between;align-items:center;font-size:12px;opacity:.95}
.hud .left,.hud .right{display:flex;gap:10px;align-items:center}
.btn{padding:4px 10px;border:1px solid currentColor;cursor:pointer;user-select:none}
.btn:active{transform:translateY(1px)}
.ui{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:10}
.ui .card{padding:18px 20px;max-width:min(92vw,860px);border:2px solid currentColor;box-shadow:0 0 0 2px currentColor inset}
.ui h1,.ui h2{font-family:'Press Start 2P',monospace;margin:0 0 14px 0}
.ui h1{font-size:22px}.ui h2{font-size:16px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.ghost{opacity:.85}
.mt8{margin-top:8px}.mt12{margin-top:12px}
input[type=text]{background:transparent;color:inherit;border:1px solid currentColor;padding:8px 10px;font:12px 'Press Start 2P',monospace;min-width:220px}
table{width:100%;border-collapse:collapse;font:12px 'Press Start 2P',monospace}
th,td{border-bottom:1px solid currentColor;padding:6px 4px;text-align:left}
.mobile{position:fixed;left:0;right:0;bottom:10px;display:none;justify-content:space-between;pointer-events:none;padding:0 8px;z-index:5}
.pad{pointer-events:auto;background:transparent;color:inherit;border:1px solid currentColor;border-radius:12px;width:31vw;height:16vh;display:flex;align-items:center;justify-content:center;font-size:18px;touch-action:none;opacity:.9}
.jump{width:31vw;height:16vh}
@media (max-width:820px){.mobile{display:flex}.hud .right{display:none}}
body:not(.invert) .ui {background:rgba(0,0,0,.78)}
body:not(.invert) .ui .card{background:rgba(0,0,0,.96);color:#fff;border-color:#fff;box-shadow:0 0 0 2px #fff inset}
body.invert .ui {background:rgba(255,255,255,.75)}
body.invert .ui .card{background:rgba(255,255,255,.98);color:#000;border-color:#000;box-shadow:0 0 0 2px #000 inset}
</style>
</head>
<body>
<div class="wrap">
  <canvas id="cv" width="960" height="540"></canvas>
  <div class="hud">
    <div class="left"><span id="status">Loading…</span></div>
    <div class="right">
      <div id="mute" class="btn">🔈 SFX</div>
      <div id="music" class="btn">♪ Music</div>
      <div id="invert" class="btn">⬛/⬜ Contrast</div>
      <div id="fs" class="btn">⛶ Full</div>
      <div id="speeddown" class="btn">–Speed</div>
      <div id="speedup" class="btn">+Speed</div>
    </div>
  </div>
</div>

<!-- simple menu / over / leaderboard kept identical -->
<div id="menu" class="ui" style="display:flex">
  <div class="card">
    <h1>MKHKASG : MOONRUNNER</h1>
    <div class="ghost mt8">Press SPACE to start</div>
  </div>
</div>
<div id="over" class="ui"><div class="card">
  <h2>Game Over</h2><div id="overScore" class="mt8"></div>
  <div class="row mt12"><div id="retryBtn" class="btn">Retry</div></div>
</div></div>

<script>
const GAME_VERSION="1.8.1";
const API_URL="https://script.google.com/macros/s/AKfycbyK7Wb7yYxaxbPBf78WcOWB9ywsAcc1-od5FIXp3WiujwzbI1sx4eu7WR43el72NaFI4g/exec";
const CV=document.getElementById("cv"),ctx=CV.getContext("2d",{alpha:false});
ctx.imageSmoothingEnabled=false;const W=960,H=540;
const FG=()=>document.body.classList.contains("invert")?"#000":"#fff";
const BG=()=>document.body.classList.contains("invert")?"#fff":"#000";
const FILL=(x,y,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(x|0,y|0,w|0,h|0)};
const pad=(n,w=5)=>String(n).padStart(w,"0");
let ac,musicBus,sfxBus,musicVol=.05,sfxVol=.28;
function ensureAC(){if(!ac){ac=new (AudioContext||webkitAudioContext)();musicBus=ac.createGain();sfxBus=ac.createGain();musicBus.connect(ac.destination);sfxBus.connect(ac.destination);musicBus.gain.value=musicVol;sfxBus.gain.value=sfxVol;}}
function beep(type="jump"){ensureAC();if(!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.type="square";let [f1,f2,d,v]={jump:[440,220,.12,.12],coin:[660,440,.12,.12],hit:[110,55,.16,.12],shield:[880,660,.1,.12]}[type];const t=ac.currentTime;o.frequency.value=f1;o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.value=v;g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(sfxBus);o.start();o.stop(t+d);}
let state="menu",score=0,best=+localStorage.getItem("moon_best")||0,scroll=0;
const speedModes=[{name:"Casual",speed:2.4,score:1.0},{name:"Normal",speed:3.2,score:1.5},{name:"Hard",speed:4.4,score:2.0}];
let speedMode=1,baseSpeed=speedModes[1].speed,scoreMul=speedModes[1].score;
function setMode(i){speedMode=(i+speedModes.length)%speedModes.length;baseSpeed=speedModes[speedMode].speed;scoreMul=speedModes[speedMode].score;}
const floorY=H-84;
const player={x:120,y:floorY-22,w:16,h:22,vx:0,vy:0,on:false,slow:0,shields:0,auraPulse:0,auraFlash:0,inv:0};
const GRAV=.65,JUMP=11.6,FRICTION=.86;
let segments=[],entities=[],items=[],timeMs=0;
function resetWorld(){segments=[];entities=[];items=[];scroll=score=timeMs=0;Object.assign(player,{x:120,y:floorY-22,vx:0,vy:0,on:false,slow:0,shields:0,auraPulse:0,auraFlash:0,inv:0});segments.push({x:0,w:400,type:"ground"});}
function spawnAhead(){} // simplified, reuse last v1.8.0 if needed
function astronaut(x,y,pose="idle"){const f=FG(),b=BG();FILL(x,y,16,22,f);FILL(x+5,y+6,6,6,b);}
function start(){resetWorld();state="play";score=0;beep("coin");}
document.getElementById("retryBtn").onclick=()=>start();
document.addEventListener("keydown",e=>{if(e.key===" "&&state==="menu")start();if(e.key===" "&&state==="over")start();});
function useShield(){player.shields=Math.max(0,player.shields-1);player.auraFlash=180;player.inv=150;beep("hit");}
function gameOver(){state="over";best=Math.max(best,score|0);localStorage.setItem("moon_best",best);document.getElementById("overScore").textContent=`Score ${pad(score|0)} • Best ${pad(best)}`;document.getElementById("menu").style.display="none";document.getElementById("over").style.display="flex";}
function update(m){timeMs+=(m/75)*1e3;player.vy+=GRAV*m;player.y+=player.vy*m;player.auraPulse=(player.auraPulse+m)%360;
if(player.auraFlash>0)player.auraFlash=Math.max(0,player.auraFlash-m*8);
if(player.inv>0)player.inv=Math.max(0,player.inv-m);
if(player.y>H+40){if(player.inv>0){player.y=floorY-player.h-2;player.vy=-JUMP*.8;}
else if(player.shields>0){useShield();player.y=floorY-player.h-2;player.vy=-JUMP*.8;}
else gameOver();}
score+=.07*m*scoreMul;}
function draw(){const f=FG(),b=BG();ctx.fillStyle=b;ctx.fillRect(0,0,W,H);
const frame=(performance.now()/120|0);
ctx.fillStyle=f;ctx.font="12px 'Press Start 2P',monospace";
ctx.fillText(`SCORE ${pad(score|0)} BEST ${pad(best)} MODE ${speedModes[speedMode].name}`,10,18);
const dots=["○","○","○"];for(let k=0;k<player.shields;k++)dots[k]="●";ctx.textAlign="right";ctx.fillText(`🛡 ${dots.join(" ")}`,W-10,18);ctx.textAlign="left";
const invBlink=player.inv>0&&frame%2===0;if(!invBlink){astronaut(player.x,player.y);}else{FILL(player.x,player.y,player.w,1,f);FILL(player.x,player.y+player.h-1,player.w,1,f);FILL(player.x,player.y,1,player.h,f);FILL(player.x+player.w-1,player.y,1,player.h,f);}
}
let last=performance.now();
function loop(now){const dt=(now-last)/1000;last=now;const m=Math.min(dt,.1)*75;if(state==="play")update(m);draw();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script>
</body>
</html>
