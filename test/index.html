<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>MKHKASG: MoonRunner v1.9.1 — Stable Character Select</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root {--w:960;--h:540;}
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:'Press Start 2P',monospace}
body.invert{background:#fff;color:#000}
.wrap{display:grid;place-items:center;height:100%;padding:10px}
canvas{width:min(96vw,96vh*(16/9));height:calc(var(--h)*(min(96vw,96vh*(16/9))/var(--w)));
image-rendering:pixelated;image-rendering:crisp-edges;background:transparent}
.ui{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:10}
.ui .card{padding:20px;border:2px solid currentColor;max-width:min(95vw,880px)}
h1,h2{margin:0 0 14px 0}
.btn{border:1px solid currentColor;padding:6px 10px;cursor:pointer;user-select:none}
.btn:active{transform:translateY(1px)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:12px}
.preview{display:flex;flex-direction:column;align-items:center;gap:6px}
.preview canvas{border:1px solid currentColor;background:transparent;width:64px;height:64px}
.ghost{opacity:.8}
</style>
</head>
<body>
<div class="wrap">
  <canvas id="cv" width="960" height="540"></canvas>
</div>

<!-- Main Menu -->
<div id="menu" class="ui" style="display:flex">
  <div class="card">
    <h1>MKHKASG: MOONRUNNER</h1>
    <div class="ghost">1-bit endless runner on the moon.</div>
    <div style="margin-top:16px;display:flex;flex-wrap:wrap;gap:8px">
      <div id="playBtn" class="btn">▶ Play</div>
      <div id="avatarsBtn" class="btn">👤 Avatars</div>
      <div id="lbBtn" class="btn">★ Leaderboard</div>
    </div>
    <div class="ghost" style="margin-top:12px">v1.9.1 Stable Build</div>
  </div>
</div>

<!-- Avatar Selection -->
<div id="avatars" class="ui">
  <div class="card">
    <h2>Choose Avatar</h2>
    <div class="grid">
      <div class="preview">
        <canvas id="pvClassic" width="32" height="44"></canvas>
        <div class="btn" data-skin="classic">Classic</div>
      </div>
      <div class="preview">
        <canvas id="pvStripe" width="32" height="44"></canvas>
        <div class="btn" data-skin="stripe">Stripe</div>
      </div>
      <div class="preview">
        <canvas id="pvAlien" width="32" height="44"></canvas>
        <div class="btn" data-skin="alien">Lil Alien</div>
      </div>
    </div>
    <div id="selectedInfo" class="ghost" style="margin-top:10px;text-align:center"></div>
    <div style="margin-top:14px;text-align:center">
      <div id="avatarsClose" class="btn">Back</div>
    </div>
  </div>
</div>

<script>
/* === simplified: core character select & preview only === */
const CV=document.getElementById('cv'),ctx=CV.getContext('2d');
const W=960,H=540;let DPR=1;
function resize(){DPR=window.devicePixelRatio||1;CV.width=W*DPR;CV.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
resize();window.onresize=resize;
function FILL(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x|0,y|0,w|0,h|0);}

/* simple draw astronaut body for preview */
function drawPreviewTo(canvas, kind){
  const c=canvas.getContext('2d');c.imageSmoothingEnabled=false;
  c.fillStyle="#000";c.fillRect(0,0,canvas.width,canvas.height);
  const f="#fff",b="#000";
  c.fillStyle=f;
  if(kind==='alien'){
    c.fillRect(10,5,12,8);c.fillRect(9,13,14,10);c.fillRect(11,23,10,4);
    c.fillStyle=b;c.fillRect(13,8,2,2);c.fillRect(17,8,2,2);
  }else{
    c.fillRect(5,12,3,10);
    c.fillRect(8,6,16,22);
    c.fillStyle=b;c.fillRect(13,12,6,6);
    if(kind==='stripe'){c.fillRect(15,7,2,20);}
  }
}
function drawPreviews(){
  drawPreviewTo(document.getElementById('pvClassic'),'classic');
  drawPreviewTo(document.getElementById('pvStripe'),'stripe');
  drawPreviewTo(document.getElementById('pvAlien'),'alien');
}

/* selection save */
let charSkin=localStorage.getItem('moon_char')||'classic';
document.getElementById('selectedInfo').textContent='Selected: '+charSkin;
function showUI(id){document.getElementById(id).style.display='flex';}
function hideUI(id){document.getElementById(id).style.display='none';}

/* menu buttons */
document.getElementById('playBtn').onclick=()=>{hideUI('menu');alert('Game starts here (placeholder).');};
document.getElementById('lbBtn').onclick=()=>alert('Leaderboard placeholder.');
document.getElementById('avatarsBtn').onclick=()=>{hideUI('menu');showUI('avatars');drawPreviews();}
document.getElementById('avatarsClose').onclick=()=>{hideUI('avatars');showUI('menu');};

/* avatar selection */
document.querySelectorAll('#avatars .btn[data-skin]').forEach(b=>{
  b.addEventListener('click',()=>{
    charSkin=b.getAttribute('data-skin');
    localStorage.setItem('moon_char',charSkin);
    document.getElementById('selectedInfo').textContent='Selected: '+charSkin;
  });
});

showUI('menu');
</script>
</body>
</html>
